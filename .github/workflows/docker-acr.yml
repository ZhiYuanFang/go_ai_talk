# 构建七微服务镜像并 push 至阿里云 ACR（不使用 ACR 控制台「构建规则」）。
# 触发（仅 tag，develop push 不构建）：
#   git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1  → 测试命名空间，tag :v1.0.0-rc.1 + :<sha>
#   git tag v1.0.0 && git push origin v1.0.0            → 生产命名空间，tag :v1.0.0 + :<sha>
# 规则：vMAJOR.MINOR.PATCH（无 - 后缀）→ 生产；v* 预发布（含 -rc/-beta 等）→ 测试
# 手动：Actions → Run workflow（workflow_dispatch）
#
# 所需 GitHub Secrets（个人版 ACR，测试/生产各一套命名空间）：
#   ACR_REGISTRY_TEST = <公网域名>/<测试命名空间>
#   ACR_REGISTRY_PROD = <公网域名>/<生产命名空间>
#                       禁止 -vpc（GitHub 公网 runner 无法访问 VPC 专线）
#   ACR_USERNAME      = ACR 控制台「访问凭证」登录用户名
#   ACR_PASSWORD      = ACR 控制台「访问凭证」固定密码
# 服务器 pull：.env.test / .env.prod 的 REGISTRY 可用 -vpc 域名，IMAGE_TAG 与 git tag 一致。
# 详见 docs/runbooks/release-deploy-and-run.md「ACR 与 GitHub Secrets」。

name: docker-acr

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_env:
        description: 推送目标命名空间
        required: true
        type: choice
        options:
          - test
          - prod
      image_tag:
        description: 镜像主 tag（如 v1.0.0-rc.1 或 v1.0.0，须与服务器 .env 中 IMAGE_TAG 一致）
        required: true
        type: string

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gateway
            dockerfile: manifest/docker/Dockerfile.gateway-service
          - id: gateway-app
            dockerfile: manifest/docker/Dockerfile.gateway-app-service
          - id: history-service
            dockerfile: manifest/docker/Dockerfile.history-service
          - id: voice-service
            dockerfile: manifest/docker/Dockerfile.voice-service
          - id: device-service
            dockerfile: manifest/docker/Dockerfile.device-service
          - id: worker
            dockerfile: manifest/docker/Dockerfile.worker-service
          - id: ucg-service
            dockerfile: manifest/docker/Dockerfile.ucg-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 选择并校验 ACR Registry
        id: acr
        shell: bash
        env:
          ACR_REGISTRY_TEST: ${{ secrets.ACR_REGISTRY_TEST }}
          ACR_REGISTRY_PROD: ${{ secrets.ACR_REGISTRY_PROD }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_REGISTRY_LEGACY: ${{ secrets.ACR_REGISTRY }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          DISPATCH_ENV: ${{ inputs.target_env }}
          DISPATCH_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          echo "GitHub Secrets 配置路径: Settings → Secrets and variables → Actions → Repository secrets"
          echo "本 workflow 要求的 Secret Name（区分大小写，须完全一致）:"
          echo "  - ACR_REGISTRY_TEST  （预发布 tag v*-* → 测试命名空间）"
          echo "  - ACR_REGISTRY_PROD  （正式 tag vMAJOR.MINOR.PATCH → 生产命名空间）"
          echo "  - ACR_USERNAME       （ACR 访问凭证登录名）"
          echo "  - ACR_PASSWORD       （ACR 访问凭证固定密码）"
          echo ""

          for name in ACR_REGISTRY_TEST ACR_REGISTRY_PROD ACR_USERNAME ACR_PASSWORD; do
            case "${name}" in
              ACR_REGISTRY_TEST) val="${ACR_REGISTRY_TEST}" ;;
              ACR_REGISTRY_PROD) val="${ACR_REGISTRY_PROD}" ;;
              ACR_USERNAME) val="${ACR_USERNAME}" ;;
              ACR_PASSWORD) val="${ACR_PASSWORD}" ;;
            esac
            if [[ -n "${val}" ]]; then
              echo "✓ Secret 已配置: ${name}"
            else
              echo "✗ Secret 未配置: ${name}"
            fi
          done
          if [[ -z "${ACR_REGISTRY_TEST}" && -z "${ACR_REGISTRY_PROD}" && -n "${ACR_REGISTRY_LEGACY}" ]]; then
            echo ""
            echo "::warning::检测到旧 Secret Name「ACR_REGISTRY」有值，但当前 workflow 已拆分为 ACR_REGISTRY_TEST / ACR_REGISTRY_PROD。"
            echo "::warning::请新建 Secret Name「ACR_REGISTRY_TEST」并填入测试命名空间地址（公网域名，无 -vpc）。"
          fi
          echo ""

          validate_registry() {
            local reg="$1"
            local secret_name="$2"
            local host ns suggested

            echo "--- 校验 Secret Name: ${secret_name} ---"

            if [[ -z "${reg}" ]]; then
              echo "::error title=缺少 Secret ${secret_name}::请在 GitHub 创建 Repository secret，Name 必须为「${secret_name}」"
              exit 1
            fi

            host="${reg%%/*}"
            if [[ "${host}" == "${reg}" ]]; then
              ns="(缺失)"
            else
              ns="${reg#*/}"
            fi

            echo "Secret Name: ${secret_name}（已读取到值）"
            echo "当前 host: ${host}"
            echo "当前 namespace: ${ns}"

            if [[ "${reg}" == *"-vpc."* ]]; then
              suggested="${host/-vpc./.}"
              if [[ "${ns}" != "(缺失)" ]]; then
                suggested="${suggested}/${ns}"
              fi
              echo "::error title=${secret_name} 误用了 -vpc 域名::GitHub Actions 公网 runner 无法 push VPC 专线地址"
              echo "::error::建议改为: ${suggested}"
              exit 1
            fi

            if [[ "${reg}" != *"/"* ]]; then
              echo "::error title=${secret_name} 缺少命名空间::Value 格式须为 <公网域名>/<命名空间>"
              exit 1
            fi

            echo "✓ ${secret_name} 格式校验通过"
            echo ""
          }

          # v1.0.0 → prod；v1.0.0-rc.1 / v1.0.0-beta.1 → test
          resolve_env_from_tag() {
            local tag="$1"
            if [[ ! "${tag}" == v* ]]; then
              echo "::error::tag 须以 v 开头: ${tag}" >&2
              exit 1
            fi
            if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo prod
            else
              echo test
            fi
          }

          deploy_env=""
          primary_tag=""

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            deploy_env="${DISPATCH_ENV}"
            primary_tag="${DISPATCH_TAG}"
            if [[ -z "${primary_tag}" ]]; then
              echo "::error::workflow_dispatch 须填写 image_tag" >&2
              exit 1
            fi
            echo "手动触发: env=${deploy_env} tag=${primary_tag}"
          elif [[ "${GIT_REF}" == refs/tags/* ]]; then
            primary_tag="${GIT_REF#refs/tags/}"
            deploy_env="$(resolve_env_from_tag "${primary_tag}")"
            echo "tag push: ${primary_tag} → ${deploy_env}"
          else
            echo "::error::不支持的 ref: ${GIT_REF}（仅 push tag v* 或 workflow_dispatch）" >&2
            exit 1
          fi

          if [[ "${deploy_env}" == "prod" ]]; then
            validate_registry "${ACR_REGISTRY_PROD}" "ACR_REGISTRY_PROD"
            selected="${ACR_REGISTRY_PROD}"
          elif [[ "${deploy_env}" == "test" ]]; then
            validate_registry "${ACR_REGISTRY_TEST}" "ACR_REGISTRY_TEST"
            selected="${ACR_REGISTRY_TEST}"
          else
            echo "::error::未知 deploy_env: ${deploy_env}" >&2
            exit 1
          fi

          if [[ -z "${ACR_USERNAME}" || -z "${ACR_PASSWORD}" ]]; then
            echo "::error title=缺少 ACR 登录凭证::请配置 Secret Name「ACR_USERNAME」与「ACR_PASSWORD」"
            exit 1
          fi

          echo "env=${deploy_env}" >> "${GITHUB_OUTPUT}"
          echo "registry=${selected}" >> "${GITHUB_OUTPUT}"
          echo "host=${selected%%/*}" >> "${GITHUB_OUTPUT}"
          echo "primary_tag=${primary_tag}" >> "${GITHUB_OUTPUT}"

      - name: 解析镜像 tag
        id: tags
        shell: bash
        env:
          ACR_REGISTRY: ${{ steps.acr.outputs.registry }}
          MATRIX_ID: ${{ matrix.id }}
          PRIMARY_TAG: ${{ steps.acr.outputs.primary_tag }}
        run: |
          set -euo pipefail
          image="${ACR_REGISTRY}/${MATRIX_ID}"
          {
            echo "list<<EOF"
            echo "${image}:${PRIMARY_TAG}"
            echo "${image}:${GITHUB_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "primary=${PRIMARY_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.host }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: 构建摘要
        shell: bash
        run: |
          echo "${{ matrix.id }} → [${{ steps.acr.outputs.env }}] ${{ steps.acr.outputs.registry }}:${{ steps.acr.outputs.primary_tag }} (+ ${GITHUB_SHA})"
