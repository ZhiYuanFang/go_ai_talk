# 构建七微服务镜像并 push 至阿里云 ACR（不使用 ACR 控制台「构建规则」）。
# 触发（仅 tag，develop push 不构建）：
#   git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1  → 测试命名空间，tag :v1.0.0-rc.1 + :<sha>
#   git tag v1.0.0 && git push origin v1.0.0            → 生产命名空间，tag :v1.0.0 + :<sha>
# 规则：vMAJOR.MINOR.PATCH（无 - 后缀）→ 生产；v* 预发布（含 -rc/-beta 等）→ 测试
# 手动：Actions → Run workflow（workflow_dispatch）
#
# ACR 配置统一在 manifest/docker/.env.test / .env.prod（无需 GitHub Secrets）：
#   REGISTRY      = 服务器 pull 地址（可用 -vpc 域名）
#   ACR_USERNAME  = ACR 控制台「访问凭证」登录用户名
#   ACR_PASSWORD  = ACR 控制台「访问凭证」固定密码
# CI push 地址由 workflow 从 REGISTRY 去掉 -vpc 自动推导。
# 详见 docs/runbooks/release-deploy-and-run.md「ACR 与 .env 统一配置」。

name: docker-acr

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_env:
        description: 推送目标命名空间
        required: true
        type: choice
        options:
          - test
          - prod
      image_tag:
        description: 镜像主 tag（如 v1.0.0-rc.1 或 v1.0.0，须与服务器 .env 中 IMAGE_TAG 一致）
        required: true
        type: string

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gateway
            dockerfile: manifest/docker/Dockerfile.gateway-service
          - id: gateway-app
            dockerfile: manifest/docker/Dockerfile.gateway-app-service
          - id: history-service
            dockerfile: manifest/docker/Dockerfile.history-service
          - id: voice-service
            dockerfile: manifest/docker/Dockerfile.voice-service
          - id: device-service
            dockerfile: manifest/docker/Dockerfile.device-service
          - id: worker
            dockerfile: manifest/docker/Dockerfile.worker-service
          - id: ucg-service
            dockerfile: manifest/docker/Dockerfile.ucg-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 选择环境并加载 .env
        id: acr
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          DISPATCH_ENV: ${{ inputs.target_env }}
          DISPATCH_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          # 从 .env 文件读取单个键（忽略注释行，取首个匹配）
          read_env_var() {
            local file="$1" key="$2"
            local line
            line="$(grep -E "^${key}=" "${file}" | head -1 || true)"
            if [[ -z "${line}" ]]; then
              echo ""
              return
            fi
            echo "${line#*=}"
          }

          validate_push_registry() {
            local reg="$1"
            local env_file="$2"
            local host ns suggested

            if [[ -z "${reg}" ]]; then
              echo "::error title=缺少 REGISTRY::请在 ${env_file} 配置 REGISTRY=<域名>/<命名空间>"
              exit 1
            fi

            host="${reg%%/*}"
            if [[ "${host}" == "${reg}" ]]; then
              ns="(缺失)"
            else
              ns="${reg#*/}"
            fi

            echo "env_file: ${env_file}"
            echo "push host: ${host}"
            echo "push namespace: ${ns}"

            if [[ "${reg}" == *"-vpc."* ]]; then
              suggested="${host/-vpc./.}"
              if [[ "${ns}" != "(缺失)" ]]; then
                suggested="${suggested}/${ns}"
              fi
              echo "::error title=REGISTRY 仍含 -vpc::GitHub Actions 公网 runner 无法 push VPC 专线地址"
              echo "::error::请检查 ${env_file} 中 REGISTRY 格式，推导后应为: ${suggested}"
              exit 1
            fi

            if [[ "${reg}" != *"/"* ]]; then
              echo "::error title=REGISTRY 缺少命名空间::格式须为 <公网域名>/<命名空间>"
              exit 1
            fi

            echo "✓ push registry 格式校验通过"
          }

          # v1.0.0 → prod；v1.0.0-rc.1 / v1.0.0-beta.1 → test
          resolve_env_from_tag() {
            local tag="$1"
            if [[ ! "${tag}" == v* ]]; then
              echo "::error::tag 须以 v 开头: ${tag}" >&2
              exit 1
            fi
            if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo prod
            else
              echo test
            fi
          }

          deploy_env=""
          primary_tag=""

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            deploy_env="${DISPATCH_ENV}"
            primary_tag="${DISPATCH_TAG}"
            if [[ -z "${primary_tag}" ]]; then
              echo "::error::workflow_dispatch 须填写 image_tag" >&2
              exit 1
            fi
            echo "手动触发: env=${deploy_env} tag=${primary_tag}"
          elif [[ "${GIT_REF}" == refs/tags/* ]]; then
            primary_tag="${GIT_REF#refs/tags/}"
            deploy_env="$(resolve_env_from_tag "${primary_tag}")"
            echo "tag push: ${primary_tag} → ${deploy_env}"
          else
            echo "::error::不支持的 ref: ${GIT_REF}（仅 push tag v* 或 workflow_dispatch）" >&2
            exit 1
          fi

          env_file="manifest/docker/.env.${deploy_env}"
          if [[ ! -f "${env_file}" ]]; then
            echo "::error title=缺少环境文件::未找到 ${env_file}"
            exit 1
          fi

          registry_pull="$(read_env_var "${env_file}" "REGISTRY")"
          acr_username="$(read_env_var "${env_file}" "ACR_USERNAME")"
          acr_password="$(read_env_var "${env_file}" "ACR_PASSWORD")"

          if [[ -z "${registry_pull}" ]]; then
            echo "::error title=缺少 REGISTRY::请在 ${env_file} 配置 REGISTRY"
            exit 1
          fi
          if [[ -z "${acr_username}" ]]; then
            echo "::error title=缺少 ACR_USERNAME::请在 ${env_file} 配置 ACR_USERNAME"
            exit 1
          fi
          if [[ -z "${acr_password}" ]]; then
            echo "::error title=缺少 ACR_PASSWORD::请在 ${env_file} 配置 ACR_PASSWORD"
            exit 1
          fi

          # 从 pull 地址（可含 -vpc）推导 CI push 公网地址
          registry_push="${registry_pull/-vpc./.}"
          validate_push_registry "${registry_push}" "${env_file}"

          echo "::add-mask::${acr_password}"

          echo "env=${deploy_env}" >> "${GITHUB_OUTPUT}"
          echo "registry=${registry_push}" >> "${GITHUB_OUTPUT}"
          echo "host=${registry_push%%/*}" >> "${GITHUB_OUTPUT}"
          echo "primary_tag=${primary_tag}" >> "${GITHUB_OUTPUT}"
          echo "username=${acr_username}" >> "${GITHUB_OUTPUT}"
          echo "password=${acr_password}" >> "${GITHUB_OUTPUT}"

      - name: 解析镜像 tag
        id: tags
        shell: bash
        env:
          ACR_REGISTRY: ${{ steps.acr.outputs.registry }}
          MATRIX_ID: ${{ matrix.id }}
          PRIMARY_TAG: ${{ steps.acr.outputs.primary_tag }}
        run: |
          set -euo pipefail
          image="${ACR_REGISTRY}/${MATRIX_ID}"
          {
            echo "list<<EOF"
            echo "${image}:${PRIMARY_TAG}"
            echo "${image}:${GITHUB_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "primary=${PRIMARY_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.host }}
          username: ${{ steps.acr.outputs.username }}
          password: ${{ steps.acr.outputs.password }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: 构建摘要
        shell: bash
        run: |
          echo "${{ matrix.id }} → [${{ steps.acr.outputs.env }}] ${{ steps.acr.outputs.registry }}:${{ steps.acr.outputs.primary_tag }} (+ ${GITHUB_SHA})"
