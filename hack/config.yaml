# CLI tool, only in development environment.
# https://goframe.org/pages/viewpage.action?pageId=3673173
gfcli:
  gen:
    dao:
    # device 域：user/event/action
    - link:     "mysql:root:Fang930927@tcp(120.55.50.105:3306)/ai_voice_device"
      tables:   "user,event,action,wx"
      jsonCase: "CamelLower"
    # voice 域：qa/suggest
    - link:     "mysql:root:Fang930927@tcp(120.55.50.105:3306)/ai_voice_voice"
      tables:   "qa,suggest"
      jsonCase: "CamelLower"
    # history 域：history
    - link:     "mysql:root:Fang930927@tcp(120.55.50.105:3306)/ai_voice_history"
      tables:   "history"
      jsonCase: "CamelLower"
    # ucg 域：ucg
    - link:     "mysql:root:Fang930927@tcp(120.55.50.105:3306)/ai_voice_ucg"
      tables:   "ucg_profile, ucg_post, ucg_post_media, ucg_follow, ucg_post_like, ucg_post_comment, ucg_conversation, ucg_conversation_member, ucg_post_recommend"
      jsonCase: "CamelLower"
    # app 域：gateway-app 读 ai_voice_app.version 等
    - link:     "mysql:root:Fang930927@tcp(120.55.50.105:3306)/ai_voice_app"
      tables:   "version"
      jsonCase: "CamelLower"
    # worker 域：domain_outbox（worker 专用库 ai_voice_worker）
    - link:     "mysql:root:Fang930927@tcp(120.55.50.105:3306)/ai_voice_worker"
      tables:   "domain_outbox"
      jsonCase: "CamelLower"
  docker:
    build: "-a amd64 -s linux -p temp -ew"
    tagPrefixes:
    - ccr.ccs.tencentyun.com/cdb.khaos.eros
