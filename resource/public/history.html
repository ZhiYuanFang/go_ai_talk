<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设备历史记录</title>
    <style>
        :root{
            --bg1:#eef6ff;
            --bg2:#f7fbff;
            --accent:#6ab5ff;
            --accent-soft:#d8ecff;
            --btn:#4a9fff;
            --btn-hover:#328ff8;
            --text:#234;
            --card:#ffffff;
        }
        body{font-family:Arial,Helvetica,sans-serif;background-color:var(--bg1);color:var(--text);margin:0;padding:24px;position:relative;overflow-x:hidden}
        .bubble-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
        .bubble{position:absolute;bottom:-120px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.98),rgba(255,255,255,.42));box-shadow:inset 0 0 12px rgba(255,255,255,.52),0 12px 26px rgba(66,140,220,.18),0 0 0 1px rgba(255,255,255,.36);opacity:.78;animation:floatUp var(--dur) linear infinite;animation-delay:var(--delay)}
        .bubble::after{content:"";position:absolute;inset:18% 18% auto auto;width:24%;height:24%;border-radius:50%;background:rgba(255,255,255,.55)}
        .bubble::before{content:"";position:absolute;inset:9% 55% auto 15%;height:18%;border-radius:50%;background:rgba(255,255,255,.6);filter:blur(1px)}
        @keyframes floatUp{
            0%{transform:translate3d(0,0,0) scale(.9);opacity:0}
            10%{opacity:.65}
            50%{transform:translate3d(var(--drift),-45vh,0) scale(1)}
            100%{transform:translate3d(calc(var(--drift) * -1),-110vh,0) scale(1.08);opacity:0}
        }
        body.sex-male{--bg1:#e8f4ff;--bg2:#f4faff;--accent:#68b5ff;--accent-soft:#d7ecff;--btn:#4a9fff;--btn-hover:#328ff8;--text:#18324d}
        body.sex-female{--bg1:#ffeaf3;--bg2:#fff5f9;--accent:#ff8ab7;--accent-soft:#ffe0ef;--btn:#ff6ca8;--btn-hover:#ff5b9f;--text:#5a2a44}
        .card{background:var(--card);border-radius:16px;padding:16px;max-width:1080px;margin:0 auto 16px;box-shadow:0 6px 16px rgba(0,0,0,.06);border:1px solid var(--accent-soft);position:relative;z-index:1}
        h1,h3{margin:0 0 12px 0}
        .muted{color:#666;font-size:13px}
        .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .meta-row input,.meta-row select{padding:6px 8px;border:1px solid var(--accent-soft);border-radius:8px;min-width:180px;background:#fff}
        #chatInput{padding-top:12px;padding-bottom:12px}
        button{padding:6px 10px;border:1px solid var(--accent-soft);border-radius:8px;background:#fff;cursor:pointer;transition:all .18s ease}
        button:hover{transform:translateY(-1px)}
        .meta-row button{padding:6px 10px}
        .meta-row button.primary{background:var(--btn);color:#fff;border-color:var(--btn)}
        .meta-row button.primary:hover{background:var(--btn-hover)}
        .btn-primary{background:var(--btn);color:#fff;border-color:var(--btn)}
        .btn-primary:hover{background:var(--btn-hover)}
        .btn-secondary{background:var(--accent-soft);color:var(--text);border-color:var(--accent-soft)}
        .btn-danger{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
        .btn-danger:hover{background:#f25555}
        .table-wrap{overflow-x:auto;margin-top:10px}
        /* 约 20 条数据高度，超出纵向滚动（表头固定） */
        .scroll-max-20{
            max-height:min(72vh,calc(20 * 2.85rem));
            overflow-y:auto;
            overflow-x:auto;
            border:1px solid var(--accent-soft);
            border-radius:10px;
        }
        .scroll-max-20 table{width:max-content;min-width:100%;border-collapse:collapse}
        .scroll-max-20 thead th{
            position:sticky;
            top:0;
            z-index:2;
            background:var(--card);
            box-shadow:0 1px 0 #eee;
        }
        table{width:max-content;min-width:100%;border-collapse:collapse}
        th,td{border-bottom:1px solid #eee;padding:10px;text-align:left;font-size:13px;white-space:nowrap;vertical-align:middle}
        .suggest-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--accent-soft);border-radius:10px;margin-bottom:10px;background:#fff}
        .suggest-time{flex-shrink:0;font-size:12px;color:#666;margin:0;min-width:8.5em}
        .suggest-item > div:last-child{flex:1;min-width:0;word-break:break-word}
        td.history-remark{white-space:normal;word-break:break-word;max-width:320px;vertical-align:middle}
        .section-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
        .section-head h3{margin:0}
        .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:99}
        .modal.show{display:flex}
        .modal-card{background:#fff;border-radius:14px;padding:16px;min-width:320px;max-width:560px;width:90%;box-shadow:0 10px 30px rgba(0,0,0,.15);border:1px solid var(--accent-soft)}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .form-grid .full{grid-column:1 / -1}
        .form-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#444}
        .form-grid input,.form-grid select{padding:8px;border:1px solid var(--accent-soft);border-radius:8px}
        .required::after{content:' *';color:#c1121f}
        .field-error{font-size:12px;color:#c1121f;display:none}
        .pagination-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px}
        .pagination-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .pagination-actions select{padding:6px 8px;border:1px solid var(--accent-soft);border-radius:8px;background:#fff}
    </style>
</head>
<body>
    <div class="bubble-bg" aria-hidden="true">
        <span class="bubble" style="left:4%;width:44px;height:44px;--dur:20s;--delay:-4s;--drift:26px;"></span>
        <span class="bubble" style="left:12%;width:26px;height:26px;--dur:15s;--delay:-9s;--drift:18px;"></span>
        <span class="bubble" style="left:22%;width:62px;height:62px;--dur:24s;--delay:-2s;--drift:34px;"></span>
        <span class="bubble" style="left:36%;width:38px;height:38px;--dur:18s;--delay:-12s;--drift:22px;"></span>
        <span class="bubble" style="left:49%;width:28px;height:28px;--dur:14s;--delay:-5s;--drift:16px;"></span>
        <span class="bubble" style="left:58%;width:52px;height:52px;--dur:23s;--delay:-8s;--drift:30px;"></span>
        <span class="bubble" style="left:68%;width:32px;height:32px;--dur:17s;--delay:-11s;--drift:20px;"></span>
        <span class="bubble" style="left:78%;width:48px;height:48px;--dur:21s;--delay:-6s;--drift:28px;"></span>
        <span class="bubble" style="left:88%;width:24px;height:24px;--dur:13s;--delay:-10s;--drift:14px;"></span>
        <span class="bubble" style="left:95%;width:40px;height:40px;--dur:19s;--delay:-3s;--drift:24px;"></span>
    </div>
    <div class="card">
        <h1>设备历史记录</h1>
        <div class="meta-row muted">
            <span>生日：</span>
            <input id="birthdayInput" type="date" />
            <span>性别：</span>
            <select id="sexInput">
                <option value="1">男</option>
                <option value="0">女</option>
            </select>
            <button id="saveBirthdayBtn" class="primary" type="button">保存</button>
            <span id="meta"></span>
        </div>
    </div>

    <div class="card">
        <h3>文本对话</h3>
        <div class="meta-row">
            <input id="chatInput" type="text" placeholder="输入要发送给智能对话的文本" style="min-width:320px;flex:1;" />
            <button id="chatSendBtn" class="primary" type="button">发送</button>
        </div>
        <div id="chatMeta" class="muted" style="margin-top:8px;"></div>
        <div id="chatReplyWrap" class="suggest-item" style="margin-top:10px;display:none;"></div>
    </div>

    <div class="card">
        <div class="section-head">
            <h3>历史事件</h3>
            <div class="meta-row">
                <button id="refreshHistoryBtn" class="btn-secondary" type="button">刷新</button>
                <button id="addHistoryBtn" class="btn-primary" type="button">添加</button>
            </div>
        </div>
        <div class="table-wrap scroll-max-20">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>事件名</th>
                        <th>数量/时长</th>
                        <th>开始时间</th>
                        <th>结束时间</th>
                        <th>备注</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
        <div class="pagination-bar muted">
            <div id="historyPaginationStatus">共 0 条</div>
            <div class="pagination-actions">
                <label>每页
                    <select id="historyPageSizeSelect">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    条
                </label>
                <button id="historyPrevBtn" class="btn-secondary" type="button">上一页</button>
                <button id="historyNextBtn" class="btn-secondary" type="button">下一页</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-head">
            <h3>历史成长建议</h3>
        </div>
        <div id="suggestWrap" class="scroll-max-20"></div>
    </div>
    <div id="historyModal" class="modal">
        <div class="modal-card">
            <h3 id="historyModalTitle">新增历史事件</h3>
            <div class="form-grid" style="margin-top:10px;">
                <label class="required">历史事件
                    <select id="fEventSelect"></select>
                </label>
                <label id="fEventNumberWrap" class="required">
                    数量
                    <input id="fEventNumber" type="number" placeholder="例如 1" />
                </label>
                <label id="fStartTimeWrap" class="required">开始时间
                    <input id="fStartTime" type="datetime-local" />
                </label>
                <label id="fEndTimeLabel" class="required">结束时间<span id="fEndTimeHint" class="muted" style="font-weight:normal;font-size:12px;"></span>
                    <input id="fEndTime" type="datetime-local" />
                </label>
                <label class="full">备注
                    <input id="fRemark" type="text" placeholder="可选" />
                </label>
            </div>
            <div id="historyFormError" class="field-error" style="margin-top:8px;"></div>
            <div id="historyAutoTimePreview" class="muted" style="margin-top:6px;display:none;"></div>
            <div class="meta-row" style="justify-content:flex-end;margin-top:12px;">
                <button id="historyModalCancelBtn" class="btn-secondary" type="button">取消</button>
                <button id="historyModalSubmitBtn" class="btn-primary" type="button">提交</button>
            </div>
        </div>
    </div>

    <script>
        const parts = window.location.pathname.split('/').filter(Boolean);
        const deviceNo = decodeURIComponent(parts[parts.length - 1] || '').trim();
        const meta = document.getElementById('meta');
        const birthdayInput = document.getElementById('birthdayInput');
        const saveBirthdayBtn = document.getElementById('saveBirthdayBtn');
        const sexInput = document.getElementById('sexInput');
        const historyBody = document.getElementById('historyBody');
        const suggestWrap = document.getElementById('suggestWrap');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const chatMeta = document.getElementById('chatMeta');
        const chatReplyWrap = document.getElementById('chatReplyWrap');
        const addHistoryBtn = document.getElementById('addHistoryBtn');
        const refreshHistoryBtn = document.getElementById('refreshHistoryBtn');
        const historyPaginationStatus = document.getElementById('historyPaginationStatus');
        const historyPageSizeSelect = document.getElementById('historyPageSizeSelect');
        const historyPrevBtn = document.getElementById('historyPrevBtn');
        const historyNextBtn = document.getElementById('historyNextBtn');
        const historyModal = document.getElementById('historyModal');
        const historyModalTitle = document.getElementById('historyModalTitle');
        const historyModalSubmitBtn = document.getElementById('historyModalSubmitBtn');
        const historyModalCancelBtn = document.getElementById('historyModalCancelBtn');
        const fEventSelect = document.getElementById('fEventSelect');
        const fEventNumberWrap = document.getElementById('fEventNumberWrap');
        const fStartTimeWrap = document.getElementById('fStartTimeWrap');
        const fEventNumber = document.getElementById('fEventNumber');
        const fStartTime = document.getElementById('fStartTime');
        const fEndTime = document.getElementById('fEndTime');
        const fEndTimeLabel = document.getElementById('fEndTimeLabel');
        const fEndTimeHint = document.getElementById('fEndTimeHint');
        const fRemark = document.getElementById('fRemark');
        const historyFormError = document.getElementById('historyFormError');
        const historyAutoTimePreview = document.getElementById('historyAutoTimePreview');
        let historyModalMode = 'add';
        let editingHistoryId = 0;
        let currentRows = [];
        let historyPage = 1;
        let historyPageSize = 20;
        let historyTotal = 0;
        let eventOptions = [];
        let currentSex = 1;
        let voiceWS = null;
        const streamAudioState = {
            pendingChunks: new Map(),
            nextSeq: 1,
            playing: false,
            ended: false
        };
        const streamReplyState = {
            active: false,
            text: ''
        };

        function applyThemeBySex(sex){
            document.body.classList.remove('sex-male', 'sex-female');
            if(Number(sex) > 0){
                document.body.classList.add('sex-male');
            }else{
                document.body.classList.add('sex-female');
            }
        }

        function parseDateTime(v){
            if(v === null || v === undefined){ return null; }
            if(typeof v === 'number' && Number.isFinite(v) && v > 0){
                return new Date(v * 1000);
            }
            const s = String(v || '').trim();
            if(!s){ return null; }
            if(/^\d+$/.test(s)){
                const sec = parseInt(s, 10);
                if(sec > 0){ return new Date(sec * 1000); }
            }
            const dt = new Date(s.replace(' ', 'T'));
            if(Number.isNaN(dt.getTime())){ return null; }
            return dt;
        }

        function formatAutoTimedNumber(startTime, endTime){
            const start = parseDateTime(startTime);
            const end = parseDateTime(endTime);
            if(!start || !end || end < start){
                return '-';
            }
            const totalSeconds = Math.round((end.getTime() - start.getTime()) / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const parts = [];
            if(hours > 0){
                parts.push(String(hours) + '时');
            }
            if(minutes > 0){
                parts.push(String(minutes).padStart(2, '0') + '分');
            }
            if(seconds > 0){
                parts.push(String(seconds).padStart(2, '0') + '秒');
            }
            if(parts.length === 0){
                parts.push('0秒');
            }
            return parts.join('');
        }

        function toDateTimeLocal(v){
            const dt = parseDateTime(v);
            if(!dt){ return ''; }
            const y = dt.getFullYear();
            const m = pad2(dt.getMonth() + 1);
            const d = pad2(dt.getDate());
            const h = pad2(dt.getHours());
            const mi = pad2(dt.getMinutes());
            return y + '-' + m + '-' + d + 'T' + h + ':' + mi;
        }

        function fromDateTimeLocal(v){
            const s = String(v || '').trim();
            if(!s){ return 0; }
            const iso = s.length > 16 ? s : (s + ':00');
            const dt = new Date(iso);
            if(Number.isNaN(dt.getTime())){ return 0; }
            return Math.floor(dt.getTime() / 1000);
        }

        function pad2(v){
            return String(v).padStart(2, '0');
        }

        function formatClock(dt){
            return pad2(dt.getHours()) + ':' + pad2(dt.getMinutes()) + ':' + pad2(dt.getSeconds());
        }

        function formatHistoryDateTime(v){
            if(v === null || v === undefined){ return '正在进行中'; }
            if(typeof v === 'number' && v === 0){ return '正在进行中'; }
            const raw = String(v || '').trim();
            if(raw === '' || raw === '0'){
                return '正在进行中';
            }
            const dt = parseDateTime(v);
            if(!dt){
                return raw;
            }
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const tomorrowStart = new Date(todayStart.getTime() + 24 * 60 * 60 * 1000);
            const yesterdayStart = new Date(todayStart.getTime() - 24 * 60 * 60 * 1000);
            if(dt >= todayStart && dt < tomorrowStart){
                return '今天 ' + formatClock(dt);
            }
            if(dt >= yesterdayStart && dt < todayStart){
                return '昨天 ' + formatClock(dt);
            }
            return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate()) + ' ' + formatClock(dt);
        }

        function rowEventNeedQuantity(eventId){
            const ev = eventOptions.find(e => String(e.id) === String(eventId));
            return !!(ev && Number(ev.needQuantity || 0) > 0);
        }

        function escapeHtml(v){
            return String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function appendChatDeltaText(delta){
            const text = String(delta || '');
            if(text === ''){
                return;
            }
            if(!streamReplyState.active){
                streamReplyState.active = true;
                streamReplyState.text = '';
                chatReplyWrap.style.display = 'block';
                chatReplyWrap.innerHTML = '<div class="suggest-time">模型回复</div><div id="chatStreamingReply"></div>';
            }
            streamReplyState.text += text;
            const slot = document.getElementById('chatStreamingReply');
            if(slot){
                slot.textContent = streamReplyState.text;
            }
        }

        function resetStreamingUI(){
            streamReplyState.active = false;
            streamReplyState.text = '';
            streamAudioState.pendingChunks.clear();
            streamAudioState.nextSeq = 1;
            streamAudioState.playing = false;
            streamAudioState.ended = false;
        }

        function base64ToBlob(base64Data){
            const binary = atob(String(base64Data || ''));
            const len = binary.length;
            const bytes = new Uint8Array(len);
            for(let i = 0; i < len; i += 1){
                bytes[i] = binary.charCodeAt(i);
            }
            return new Blob([bytes], {type: 'audio/wav'});
        }

        function playAudioBlob(blob){
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                audio.onended = () => {
                    URL.revokeObjectURL(url);
                    resolve();
                };
                audio.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('音频播放失败'));
                };
                audio.play().catch((err) => {
                    URL.revokeObjectURL(url);
                    reject(err);
                });
            });
        }

        async function drainStreamingAudioQueue(){
            if(streamAudioState.playing){
                return;
            }
            streamAudioState.playing = true;
            try{
                while(streamAudioState.pendingChunks.has(streamAudioState.nextSeq)){
                    const base64Chunk = streamAudioState.pendingChunks.get(streamAudioState.nextSeq);
                    streamAudioState.pendingChunks.delete(streamAudioState.nextSeq);
                    streamAudioState.nextSeq += 1;
                    const blob = base64ToBlob(base64Chunk);
                    await playAudioBlob(blob);
                }
            }finally{
                streamAudioState.playing = false;
            }
        }

        async function onVoiceWSMessage(raw){
            let data = raw;
            if(typeof raw === 'string'){
                try{
                    data = JSON.parse(raw);
                }catch(_e){
                    return;
                }
            }
            if(!data || typeof data !== 'object'){
                return;
            }
            const type = String(data.type || '').trim();
            if(type === 'chat_delta'){
                appendChatDeltaText(data.delta);
                chatMeta.textContent = '模型流式回复中...';
                return;
            }
            if(type === 'audio_chunk'){
                const seq = Number(data.seq || 0);
                const audio = String(data.audio || '');
                if(audio === ''){
                    return;
                }
                // streaming=true 时按 seq 有序播放；兼容旧协议（无 seq）直接顺序播放。
                if(data.streaming === true && seq > 0){
                    streamAudioState.pendingChunks.set(seq, audio);
                }else{
                    streamAudioState.pendingChunks.set(streamAudioState.nextSeq, audio);
                }
                await drainStreamingAudioQueue();
                return;
            }
            if(type === 'audio_end'){
                if(data.streaming === true){
                    streamAudioState.ended = true;
                    await drainStreamingAudioQueue();
                    chatMeta.textContent = '流式语音播放完成';
                }
                return;
            }
            if(type === 'error'){
                chatMeta.textContent = '语音链路错误：' + String(data.message || '未知错误');
                return;
            }
        }

        /** 兼容 GoFrame 统一响应：列表类 data 为 { list: [...] } */
        function asListPayload(d){
            if (Array.isArray(d)) return d;
            if (d && Array.isArray(d.list)) return d.list;
            return [];
        }

        function asPagedListPayload(d){
            if(Array.isArray(d)){
                return {
                    list: d,
                    total: d.length,
                    page: 1,
                    pageSize: d.length || historyPageSize
                };
            }
            if(d && Array.isArray(d.list)){
                return {
                    list: d.list,
                    total: Number(d.total || d.list.length || 0),
                    page: Math.max(1, Number(d.page || historyPage || 1)),
                    pageSize: Math.max(1, Number(d.pageSize || historyPageSize || 20))
                };
            }
            return {list: [], total: 0, page: 1, pageSize: historyPageSize};
        }

        function renderHistoryPagination(){
            const totalPages = historyTotal > 0 ? Math.ceil(historyTotal / historyPageSize) : 0;
            historyPaginationStatus.textContent = totalPages > 0
                ? '共 ' + historyTotal + ' 条，第 ' + historyPage + ' / ' + totalPages + ' 页'
                : '共 0 条';
            historyPrevBtn.disabled = historyPage <= 1;
            historyNextBtn.disabled = totalPages === 0 || historyPage >= totalPages;
            historyPageSizeSelect.value = String(historyPageSize);
        }

        async function api(path){
            const res = await fetch(path);
            const data = await res.json().catch(() => ({}));
            if(!res.ok || data.code !== 0) throw new Error(data.message || ('HTTP '+res.status));
            return data.data;
        }

        async function apiPost(path, body){
            const res = await fetch(path, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body || {})
            });
            const data = await res.json().catch(() => ({}));
            if(!res.ok || data.code !== 0) throw new Error(data.message || ('HTTP '+res.status));
            return data.data;
        }

        async function loadEventOptions(){
            eventOptions = asListPayload(await api('/device/history/api/event/options'));
            fEventSelect.innerHTML = '';
            if(!eventOptions || eventOptions.length === 0){
                fEventSelect.innerHTML = '<option value="">暂无事件可选</option>';
                return;
            }
            eventOptions.forEach(ev => {
                const opt = document.createElement('option');
                opt.value = String(ev.id);
                const needQuantity = Number(ev.needQuantity || 0) > 0;
                const suffix = [needQuantity ? '计数' : '计时'];
                opt.textContent = String(ev.name || ('事件#'+ev.id)) + '（' + suffix.join('/') + '）';
                opt.setAttribute('data-name', String(ev.name || ''));
                opt.setAttribute('data-need-quantity', needQuantity ? '1' : '0');
                fEventSelect.appendChild(opt);
            });
            syncEventUnitAndNumberReadonly();
        }

        async function loadHistory(){
            const query = new URLSearchParams({
                deviceNo,
                page: String(historyPage),
                pageSize: String(historyPageSize)
            });
            const payload = asPagedListPayload(await api('/device/history/api/list?' + query.toString()));
            const rows = payload.list || [];
            historyTotal = Number(payload.total || 0);
            historyPage = Math.max(1, Number(payload.page || historyPage));
            historyPageSize = Math.max(1, Number(payload.pageSize || historyPageSize));
            const totalPages = historyTotal > 0 ? Math.ceil(historyTotal / historyPageSize) : 0;
            if(rows.length === 0 && historyTotal > 0 && totalPages > 0 && historyPage > totalPages){
                historyPage = totalPages;
                return loadHistory();
            }
            currentRows = rows || [];
            renderHistoryPagination();
            historyBody.innerHTML = '';
            if(!rows || rows.length === 0){
                historyBody.innerHTML = '<tr><td colspan="7">暂无历史数据</td></tr>';
                return;
            }
            rows.forEach(it => {
                const needQty = rowEventNeedQuantity(it.eventId);
                const start = parseDateTime(it.startTime);
                const end = parseDateTime(it.endTime);
                const hasEnd = Number(it.endTime || 0) !== 0;
                let numberText;
                if(needQty){
                    numberText = String(it.eventNumber ?? '').trim() || '-';
                }else{
                    if(!start){
                        numberText = '-';
                    }else if(!hasEnd){
                        numberText = '进行中';
                    }else if(end && end >= start){
                        numberText = formatAutoTimedNumber(it.startTime, it.endTime);
                    }else{
                        numberText = '-';
                    }
                }
                const tr = document.createElement('tr');
                tr.innerHTML = '<td>'+escapeHtml(it.id)+'</td>'+
                    '<td>'+escapeHtml(it.eventName || it.eventId)+'</td>'+
                    '<td>'+escapeHtml(numberText)+'</td>'+
                    '<td>'+escapeHtml(formatHistoryDateTime(it.startTime))+'</td>'+
                    '<td>'+escapeHtml(formatHistoryDateTime(it.endTime))+'</td>'+
                    '<td class="history-remark">'+escapeHtml(it.remark)+'</td>'+
                    '<td><button type="button" class="history-edit-btn btn-primary" data-id="'+escapeHtml(it.id)+'">编辑</button> <button type="button" class="history-del-btn btn-danger" data-id="'+escapeHtml(it.id)+'">删除</button></td>';
                historyBody.appendChild(tr);
            });
            historyBody.querySelectorAll('.history-edit-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = Number(btn.getAttribute('data-id') || 0);
                    const row = rows.find(x => Number(x.id) === id);
                    if(!row){ return; }
                    openHistoryModal('edit', row);
                });
            });
            historyBody.querySelectorAll('.history-del-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = Number(btn.getAttribute('data-id') || 0);
                    if(!id){ return; }
                    if(!confirm('确认删除该历史事件吗？')){ return; }
                    try{
                        await apiPost('/device/history/api/event/delete', {id, deviceNo});
                        if(currentRows.length === 1 && historyPage > 1){
                            historyPage -= 1;
                        }
                        await loadHistory();
                    }catch(e){
                        meta.textContent = '删除历史事件失败：' + (e.message || '未知错误');
                    }
                });
            });
        }

        async function loadSuggest(){
            const rows = asListPayload(await api('/device/history/api/suggest?deviceNo=' + encodeURIComponent(deviceNo)));
            suggestWrap.innerHTML = '';
            if(!rows || rows.length === 0){
                suggestWrap.innerHTML = '<div class="muted">暂无成长建议</div>';
                return;
            }
            rows.forEach(it => {
                const div = document.createElement('div');
                div.className = 'suggest-item';
                const st = (it.time != null && Number(it.time) > 0) ? new Date(Number(it.time) * 1000).toLocaleString() : '';
                div.innerHTML = '<div class="suggest-time">'+escapeHtml(st)+'</div><div>'+escapeHtml(it.suggest)+'</div>';
                suggestWrap.appendChild(div);
            });
        }

        async function loadBirthday(){
            const data = await api('/device/history/api/birthday?deviceNo=' + encodeURIComponent(deviceNo));
            const sec = (data && data.birthday != null) ? Number(data.birthday) : 0;
            currentSex = Number((data && data.sex) || 0) > 0 ? 1 : 0;
            if(sec > 0){
                const d = new Date(sec * 1000);
                birthdayInput.value = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
            }else{
                birthdayInput.value = '';
            }
            sexInput.value = String(currentSex);
            applyThemeBySex(currentSex);
            meta.textContent = sec > 0 ? '已加载' : '未设置';
        }

        async function saveBirthday(){
            const raw = String(birthdayInput.value || '').trim();
            let birthday = 0;
            if(raw){
                const dt = new Date(raw + 'T00:00:00');
                if(!Number.isNaN(dt.getTime())){
                    birthday = Math.floor(dt.getTime() / 1000);
                }
            }
            const sex = Number(sexInput.value || 0) > 0 ? 1 : 0;
            await apiPost('/device/history/api/birthday/save', {deviceNo, birthday, sex});
            currentSex = sex;
            applyThemeBySex(currentSex);
            meta.textContent = birthday ? '保存成功' : '已清空';
        }

        async function sendTextChat(){
            const transcript = String(chatInput.value || '').trim();
            if(!transcript){
                chatMeta.textContent = '请输入文本后再发送';
                chatReplyWrap.style.display = 'none';
                return;
            }
            chatSendBtn.disabled = true;
            chatMeta.textContent = '发送中...';
            resetStreamingUI();
            try{
                const data = await apiPost('/device/history/api/chat', {deviceNo, transcript});
                const reply = String((data && data.reply) || '').trim();
                chatReplyWrap.style.display = 'block';
                chatReplyWrap.innerHTML = '<div class="suggest-time">模型回复</div><div>'+escapeHtml(reply || '(空回复)')+'</div>';
                chatMeta.textContent = '发送成功';
            }catch(e){
                chatReplyWrap.style.display = 'none';
                chatMeta.textContent = '发送失败：' + (e.message || '未知错误');
            }finally{
                chatSendBtn.disabled = false;
            }
        }

        function openHistoryModal(mode, row){
            historyModalMode = mode;
            editingHistoryId = mode === 'edit' ? Number(row.id || 0) : 0;
            historyModalTitle.textContent = mode === 'edit' ? '编辑历史事件' : '新增历史事件';
            const targetEventId = String((row && row.eventId) || '');
            if(targetEventId && Array.from(fEventSelect.options).some(o => o.value === targetEventId)){
                fEventSelect.value = targetEventId;
            } else if (fEventSelect.options.length > 0) {
                fEventSelect.selectedIndex = 0;
            }
            fEventNumber.value = String((row && row.eventNumber) || 0);
            fStartTime.value = toDateTimeLocal(row && row.startTime);
            fEndTime.value = toDateTimeLocal(row && row.endTime);
            fRemark.value = String((row && row.remark) || '');
            syncEventUnitAndNumberReadonly();
            historyFormError.style.display = 'none';
            historyFormError.textContent = '';
            historyModalSubmitBtn.disabled = false;
            historyModalSubmitBtn.textContent = '提交';
            historyModal.classList.add('show');
        }

        function closeHistoryModal(){
            historyModal.classList.remove('show');
        }

        async function submitHistoryModal(){
            const selected = fEventSelect.options[fEventSelect.selectedIndex];
            const needQuantity = Number((selected && selected.getAttribute('data-need-quantity')) || 0) > 0;
            const endTimeSec = fromDateTimeLocal(fEndTime.value);
            const startTimeSec = needQuantity ? endTimeSec : fromDateTimeLocal(fStartTime.value);
            const payload = {
                deviceNo,
                eventId: Number(fEventSelect.value || 0),
                eventName: String((fEventSelect.options[fEventSelect.selectedIndex] || {}).getAttribute('data-name') || '').trim(),
                eventNumber: needQuantity ? Number(fEventNumber.value || 0) : 0,
                startTime: startTimeSec,
                endTime: endTimeSec,
                remark: String(fRemark.value || '').trim()
            };
            if(!payload.eventId || !payload.eventName){
                historyFormError.style.display = 'block';
                historyFormError.textContent = '请选择历史事件';
                return;
            }
            if(needQuantity && payload.endTime === 0){
                historyFormError.style.display = 'block';
                historyFormError.textContent = '计数事件请填写结束时间';
                return;
            }
            if(!needQuantity && payload.startTime === 0){
                historyFormError.style.display = 'block';
                historyFormError.textContent = '请完整填写必填项：历史事件、开始时间';
                return;
            }
            if(needQuantity && Number.isNaN(payload.eventNumber)){
                historyFormError.style.display = 'block';
                historyFormError.textContent = '需要计数的事件必须填写数量';
                return;
            }
            if(payload.endTime !== 0 && payload.endTime < payload.startTime){
                historyFormError.style.display = 'block';
                historyFormError.textContent = '结束时间不能早于开始时间';
                return;
            }
            historyModalSubmitBtn.disabled = true;
            historyModalSubmitBtn.textContent = '提交中...';
            try{
                if(historyModalMode === 'edit'){
                    await apiPost('/device/history/api/event/update', Object.assign({id: editingHistoryId}, payload));
                }else{
                    await apiPost('/device/history/api/event/add', payload);
                    historyPage = 1;
                }
                closeHistoryModal();
                await loadHistory();
            }catch(e){
                historyFormError.style.display = 'block';
                historyFormError.textContent = (historyModalMode === 'edit' ? '修改' : '新增') + '失败：' + (e.message || '未知错误');
            }finally{
                historyModalSubmitBtn.disabled = false;
                historyModalSubmitBtn.textContent = '提交';
            }
        }

        async function boot(){
            if(!deviceNo){
                meta.textContent = '未指定设备号';
                birthdayInput.disabled = true;
                saveBirthdayBtn.disabled = true;
                historyBody.innerHTML = '<tr><td colspan="7">未指定设备号</td></tr>';
                suggestWrap.innerHTML = '<div class="muted">未指定设备号</div>';
                return;
            }
            try {
                await loadBirthday();
                await loadEventOptions();
                await loadHistory();
                await loadSuggest();
            } catch (e) {
                meta.textContent = '生日信息加载失败：' + (e.message || '未知错误');
            }
        }
        saveBirthdayBtn.addEventListener('click', async () => {
            try {
                await saveBirthday();
            } catch (e) {
                meta.textContent = '保存失败：' + (e.message || '未知错误');
            }
        });
        chatSendBtn.addEventListener('click', sendTextChat);
        chatInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter'){
                e.preventDefault();
                sendTextChat();
            }
        });
        addHistoryBtn.addEventListener('click', async () => {
            openHistoryModal('add', {});
        });
        refreshHistoryBtn.addEventListener('click', async () => {
            try{
                await loadHistory();
                meta.textContent = '历史事件已刷新';
            }catch(e){
                meta.textContent = '刷新历史事件失败：' + (e.message || '未知错误');
            }
        });
        historyPageSizeSelect.addEventListener('change', async () => {
            historyPageSize = Math.max(1, Number(historyPageSizeSelect.value || 20));
            historyPage = 1;
            try{
                await loadHistory();
            }catch(e){
                meta.textContent = '切换分页失败：' + (e.message || '未知错误');
            }
        });
        historyPrevBtn.addEventListener('click', async () => {
            if(historyPage <= 1){
                return;
            }
            historyPage -= 1;
            try{
                await loadHistory();
            }catch(e){
                historyPage += 1;
                meta.textContent = '上一页加载失败：' + (e.message || '未知错误');
            }
        });
        historyNextBtn.addEventListener('click', async () => {
            const totalPages = historyTotal > 0 ? Math.ceil(historyTotal / historyPageSize) : 0;
            if(totalPages === 0 || historyPage >= totalPages){
                return;
            }
            historyPage += 1;
            try{
                await loadHistory();
            }catch(e){
                historyPage -= 1;
                meta.textContent = '下一页加载失败：' + (e.message || '未知错误');
            }
        });
        historyModalCancelBtn.addEventListener('click', closeHistoryModal);
        historyModalSubmitBtn.addEventListener('click', submitHistoryModal);
        fEventSelect.addEventListener('change', syncEventUnitAndNumberReadonly);
        fStartTime.addEventListener('input', updateAutoTimePreview);
        fEndTime.addEventListener('input', updateAutoTimePreview);
        historyModal.addEventListener('click', (e) => {
            if(e.target === historyModal){
                closeHistoryModal();
            }
        });
        boot();
        applyThemeBySex(currentSex);
        // 供语音WS调试使用：可在控制台把 ws.onmessage 代理到该方法。
        // 示例：ws.onmessage = (evt) => window.handleVoiceWSMessage(evt.data)
        window.handleVoiceWSMessage = onVoiceWSMessage;

        function syncEventUnitAndNumberReadonly(){
            const selected = fEventSelect.options[fEventSelect.selectedIndex];
            const needQuantity = Number((selected && selected.getAttribute('data-need-quantity')) || 0) > 0;
            fEventNumberWrap.style.display = needQuantity ? '' : 'none';
            fStartTimeWrap.style.display = needQuantity ? 'none' : '';
            if(fEndTimeLabel){
                if(needQuantity){
                    fEndTimeLabel.classList.add('required');
                    if(fEndTimeHint){ fEndTimeHint.textContent = ''; }
                }else{
                    fEndTimeLabel.classList.remove('required');
                    if(fEndTimeHint){ fEndTimeHint.textContent = '（可选，留空表示正在进行中）'; }
                }
            }
            if(needQuantity){
                fEventNumber.placeholder = '例如 1';
                fEventNumber.readOnly = false;
                fEventNumber.disabled = false;
            }else{
                fEventNumber.value = '';
            }
            updateAutoTimePreview();
        }

        function updateAutoTimePreview(){
            const selected = fEventSelect.options[fEventSelect.selectedIndex];
            const needQuantity = Number((selected && selected.getAttribute('data-need-quantity')) || 0) > 0;
            if(needQuantity){
                historyAutoTimePreview.style.display = 'none';
                historyAutoTimePreview.textContent = '';
                return;
            }
            const start = parseDateTime(fromDateTimeLocal(fStartTime.value));
            const end = parseDateTime(fromDateTimeLocal(fEndTime.value));
            if(!start){
                historyAutoTimePreview.style.display = 'block';
                historyAutoTimePreview.textContent = '计时预览：请填写开始时间';
                return;
            }
            if(!end){
                historyAutoTimePreview.style.display = 'block';
                historyAutoTimePreview.textContent = '计时预览：结束时间留空表示正在进行中';
                return;
            }
            if(end < start){
                historyAutoTimePreview.style.display = 'block';
                historyAutoTimePreview.textContent = '计时预览：结束时间不能早于开始时间';
                return;
            }
            const autoDisplay = formatAutoTimedNumber(fromDateTimeLocal(fStartTime.value), fromDateTimeLocal(fEndTime.value));
            historyAutoTimePreview.style.display = 'block';
            historyAutoTimePreview.textContent = '计时预览：将自动计算为 ' + autoDisplay;
        }
    </script>
</body>
</html>
