<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>App 版本管理 — gateway-app</title>
	<style>
		:root{
			--bg-1:#fdf2f8;
			--bg-2:#e0f2fe;
			--bg-3:#ede9fe;
			--text:#1f2937;
			--muted:#6b7280;
			--line:rgba(255,255,255,.45);
			--glass:rgba(255,255,255,.30);
			--glass-strong:rgba(255,255,255,.52);
			--shadow:0 24px 80px rgba(94, 84, 142, .18);
			--err:#b91c1c;
			--ok:#059669;
		}
		*{box-sizing:border-box}
		body{
			margin:0;
			font-family:"Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
			color:var(--text);
			background:
				radial-gradient(circle at 10% 10%, rgba(236,72,153,.22), transparent 28%),
				radial-gradient(circle at 88% 18%, rgba(56,189,248,.24), transparent 30%),
				radial-gradient(circle at 55% 85%, rgba(168,85,247,.18), transparent 34%),
				linear-gradient(135deg, var(--bg-1), var(--bg-2) 48%, var(--bg-3));
			min-height:100vh;
		}
		.page{width:min(1040px, calc(100% - 32px));margin:0 auto;padding:24px 0 48px}
		.glass{
			background:var(--glass);
			border:1px solid var(--line);
			backdrop-filter:blur(18px);
			-webkit-backdrop-filter:blur(18px);
			box-shadow:var(--shadow);
		}
		.header{
			display:flex;align-items:center;gap:14px;
			padding:18px 22px;border-radius:24px;margin-bottom:20px;
		}
		.logo{
			width:44px;height:44px;border-radius:14px;
			background:linear-gradient(135deg, rgba(236,72,153,.95), rgba(56,189,248,.95));
			color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;
		}
		.header h1{margin:0;font-size:22px;line-height:1.2}
		.header p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
		.card{border-radius:28px;padding:24px 26px;margin-bottom:20px}
		.card h2{margin:0 0 8px;font-size:20px}
		.card .sub{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.6}
		label{display:block;margin-top:14px;font-weight:600;font-size:14px}
		label:first-of-type{margin-top:0}
		input[type="text"],input[type="password"],input[type="number"],textarea,input[type="file"]{
			width:100%;margin-top:6px;padding:10px 12px;
			border:1px solid rgba(255,255,255,.65);border-radius:14px;
			background:rgba(255,255,255,.55);font:inherit;color:var(--text);
		}
		textarea{resize:vertical;min-height:72px}
		input[type="file"]{padding:8px}
		.check-row{margin-top:14px;font-weight:500;display:flex;align-items:center;gap:8px}
		.check-row input{width:auto;margin:0}
		.btn{
			margin-top:16px;margin-right:10px;padding:10px 18px;cursor:pointer;
			border-radius:999px;font-size:14px;font-weight:600;
			border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.45);
		}
		.btn-primary{
			background:linear-gradient(135deg, rgba(236,72,153,.95), rgba(99,102,241,.95));
			color:#fff;border:none;box-shadow:0 12px 28px rgba(236,72,153,.22);
		}
		.btn-ghost{background:rgba(255,255,255,.35)}
		.msg{min-height:1.25em;margin-top:12px;font-size:14px;line-height:1.5}
		.err{color:var(--err)}
		.ok{color:var(--ok)}
		.session-ok{color:var(--ok);font-size:14px;margin:0 0 12px}
		.table-wrap{overflow-x:auto;margin-top:12px;border-radius:18px;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.5)}
		table{width:100%;border-collapse:collapse;font-size:13px}
		th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid rgba(255,255,255,.45)}
		th{background:rgba(255,255,255,.4);font-weight:700;white-space:nowrap}
		tr:last-child td{border-bottom:none}
		.badge-latest{background:var(--ok);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px}
		#editDlg{display:none;margin-top:16px;padding:18px;border-radius:20px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.55)}
		#editDlg h3{margin:0 0 8px;font-size:17px}
		.actions button{margin-top:0;padding:6px 12px;font-size:12px}
		code{word-break:break-all;font-size:12px;background:rgba(255,255,255,.5);padding:2px 6px;border-radius:6px}
		a{color:#6d28d9}
		.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
		@media (max-width:600px){
			.page{width:calc(100% - 20px)}
			.card,.header{padding:18px}
		}
	</style>
</head>
<body>
	<div class="page">
		<header class="header glass">
			<div class="logo">APK</div>
			<div>
				<h1>App 版本管理</h1>
				<p>gateway-app · 上传 APK、维护 <code>ai_voice_app.version</code> · 须先在 <a href="/device/admin">运维 Hub</a> 登录</p>
			</div>
		</header>

		<div id="panel" style="display:none;">
			<section class="card glass">
				<p class="session-ok">已登录 · Admin JWT（与运维 Hub 共用）</p>
				<h2>历史版本</h2>
				<p id="listHint" class="sub">登录后自动加载；若始终为空，请重建 <code>gateway-app</code> 并强制刷新（Ctrl+F5）。</p>
				<div class="toolbar">
					<button type="button" id="btnRefresh" class="btn btn-ghost">刷新列表</button>
				</div>
				<p id="listMsg" class="msg"></p>
				<div class="table-wrap">
					<table id="verTable">
						<thead>
							<tr>
								<th>ID</th>
								<th>版本号</th>
								<th>上线时间</th>
								<th>downloadUrl</th>
								<th>强制</th>
								<th>minVersion</th>
								<th>备注</th>
								<th>操作</th>
							</tr>
						</thead>
						<tbody id="verBody"></tbody>
					</table>
				</div>

				<div id="editDlg">
					<h3>编辑版本 <span id="editIdLabel"></span></h3>
					<label for="editLatest">latestVersion</label>
					<input type="text" id="editLatest" />
					<label for="editNotes">releaseNotes</label>
					<textarea id="editNotes" rows="2"></textarea>
					<label for="editMin">minVersion</label>
					<input type="text" id="editMin" />
					<label for="editDate">releaseDate（Unix 秒）</label>
					<input type="number" id="editDate" min="0" step="1" />
					<label class="check-row"><input type="checkbox" id="editForce" /> forceUpdate</label>
					<button type="button" id="btnSaveEdit" class="btn btn-primary">保存</button>
					<button type="button" id="btnCancelEdit" class="btn btn-ghost">取消</button>
					<p id="editMsg" class="msg"></p>
				</div>
			</section>

			<section class="card glass">
				<h2>上传新版本 APK</h2>
				<p class="sub">单包上限由服务端 <code>gatewayApp.apkMaxBytes</code> 决定（默认 200MB）；须与 <code>server.clientMaxBodySize</code> 一致。</p>
				<form id="upForm">
					<label for="latestVersion">latestVersion（如 1.0.1）</label>
					<input type="text" id="latestVersion" required />
					<label for="releaseNotes">releaseNotes（可选）</label>
					<textarea id="releaseNotes" rows="3"></textarea>
					<label class="check-row"><input type="checkbox" id="forceUpdate" /> forceUpdate（强制更新）</label>
					<label for="apk">APK 文件</label>
					<input type="file" id="apk" accept=".apk" required />
					<button type="submit" class="btn btn-primary">上传并写库</button>
				</form>
				<p id="upMsg" class="msg"></p>
			</section>
		</div>
	</div>

	<script src="/resource/public/admin-common.js"></script>
	<script>
	(function(){
		const listMsg = document.getElementById('listMsg');
		const upMsg = document.getElementById('upMsg');
		const verBody = document.getElementById('verBody');
		const editDlg = document.getElementById('editDlg');
		const editMsg = document.getElementById('editMsg');
		let editingId = 0;

		function showErr(el, text) {
			el.className = 'msg err';
			el.textContent = text || '';
		}
		function showOk(el, text) {
			el.className = 'msg ok';
			el.textContent = text || '';
		}
		function clearMsg(el) { el.textContent = ''; el.className = 'msg'; }

		/** 将 fetch 网络层错误转为可排查的中文说明 */
		function formatFetchError(e) {
			const raw = (e && e.message) ? String(e.message) : String(e);
			if (/failed to fetch|networkerror|load failed/i.test(raw)) {
				return '网络请求失败（failed to fetch）：上传 APK 时常见原因是网关 clientMaxBodySize 过小（GoFrame 默认 8MB）或反代 body/超时限制。请确认 gateway-app 已配置 clientMaxBodySize ≥ 200MB 并已重启；大文件上传时检查 Nginx client_max_body_size。';
			}
			return raw;
		}

		function formatReleaseDate(ts) {
			if (!ts) return '—';
			const d = new Date(ts * 1000);
			return d.toLocaleString('zh-CN') + ' (' + ts + ')';
		}

		async function apiJson(url, opts) {
			opts = opts || {};
			try {
				if (opts.body instanceof FormData) {
					return await AdminCommon.adminFetchForm(url, opts.body);
				}
				return await AdminCommon.adminFetch(url, opts);
			} catch (e) {
				const err = new Error(formatFetchError(e));
				err.network = true;
				throw err;
			}
		}

		async function refreshList() {
			clearMsg(listMsg);
			verBody.innerHTML = '<tr><td colspan="8">加载中…</td></tr>';
			try {
				const data = await apiJson('/device/app/api/version/admin/list?limit=200&_=' + Date.now());
				const items = data.items || [];
				if (!items.length) {
					const total = data.total != null ? Number(data.total) : 0;
					if (total > 0) {
						showErr(listMsg, '数据库有 ' + total + ' 条记录但页面未解析出列表，请查看 gateway-app 日志或联系运维');
					} else {
						clearMsg(listMsg);
					}
					verBody.innerHTML = '<tr><td colspan="8">' + (total > 0 ? '列表解析异常' : '暂无发版记录（可先上传 APK）') + '</td></tr>';
					return;
				}
				verBody.innerHTML = '';
				items.forEach(function(row) {
					const tr = document.createElement('tr');
					const latestBadge = row.isLatest ? ' <span class="badge-latest">当前 check 最新</span>' : '';
					const dl = row.downloadUrl || '';
					const dlHtml = dl ? '<code><a href="' + dl + '" target="_blank" rel="noopener">' + dl + '</a></code>' : '—';
					tr.innerHTML =
						'<td>' + row.id + latestBadge + '</td>' +
						'<td>' + escapeHtml(row.latestVersion || '') + '</td>' +
						'<td>' + escapeHtml(formatReleaseDate(row.releaseDate)) + '</td>' +
						'<td>' + dlHtml + '</td>' +
						'<td>' + (row.forceUpdate ? '是' : '否') + '</td>' +
						'<td>' + escapeHtml(row.minVersion || '—') + '</td>' +
						'<td>' + escapeHtml((row.releaseNotes || '').slice(0, 80)) + (row.releaseNotes && row.releaseNotes.length > 80 ? '…' : '') + '</td>' +
						'<td class="actions"></td>';
					const actions = tr.querySelector('.actions');
					const btnEdit = document.createElement('button');
					btnEdit.type = 'button';
					btnEdit.className = 'btn btn-ghost';
					btnEdit.textContent = '编辑';
					btnEdit.addEventListener('click', function(){ openEdit(row); });
					const btnDel = document.createElement('button');
					btnDel.type = 'button';
					btnDel.className = 'btn btn-ghost';
					btnDel.textContent = '删除';
					btnDel.addEventListener('click', function(){ deleteRow(row); });
					actions.appendChild(btnEdit);
					actions.appendChild(btnDel);
					verBody.appendChild(tr);
				});
				showOk(listMsg, '共 ' + (data.total != null ? data.total : items.length) + ' 条');
			} catch (e) {
				verBody.innerHTML = '';
				showErr(listMsg, formatFetchError(e));
			}
		}

		function escapeHtml(s) {
			return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
		}

		function openEdit(row) {
			editingId = row.id;
			document.getElementById('editIdLabel').textContent = '#' + row.id;
			document.getElementById('editLatest').value = row.latestVersion || '';
			document.getElementById('editNotes').value = row.releaseNotes || '';
			document.getElementById('editMin').value = row.minVersion || '';
			document.getElementById('editDate').value = row.releaseDate || 0;
			document.getElementById('editForce').checked = !!row.forceUpdate;
			editDlg.style.display = 'block';
			clearMsg(editMsg);
			editDlg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
		}

		document.getElementById('btnCancelEdit').addEventListener('click', function(){
			editDlg.style.display = 'none';
			editingId = 0;
		});

		document.getElementById('btnSaveEdit').addEventListener('click', async function(){
			if (!editingId) return;
			clearMsg(editMsg);
			const body = {
				id: editingId,
				latestVersion: (document.getElementById('editLatest').value || '').trim(),
				releaseNotes: (document.getElementById('editNotes').value || '').trim(),
				minVersion: (document.getElementById('editMin').value || '').trim(),
				releaseDate: parseInt(document.getElementById('editDate').value, 10) || 0,
				forceUpdate: document.getElementById('editForce').checked
			};
			try {
				await apiJson('/device/app/api/version/admin/update', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(body)
				});
				showOk(editMsg, '已保存');
				editDlg.style.display = 'none';
				await refreshList();
			} catch (e) {
				showErr(editMsg, formatFetchError(e));
			}
		});

		async function deleteRow(row) {
			const hint = row.isLatest
				? '该记录为 version/check 当前最新行，删除后客户端将看到次新 id 行。'
				: '';
			if (!confirm('确定删除版本 #' + row.id + ' ' + (row.latestVersion || '') + '？\n' + hint)) {
				return;
			}
			try {
				await apiJson('/device/app/api/version/admin/delete', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ id: row.id })
				});
				await refreshList();
			} catch (e) {
				showErr(listMsg, formatFetchError(e));
			}
		}

		document.getElementById('btnRefresh').addEventListener('click', refreshList);

		document.getElementById('upForm').addEventListener('submit', async function(ev){
			ev.preventDefault();
			clearMsg(upMsg);
			const latestVersion = (document.getElementById('latestVersion').value || '').trim();
			const releaseNotes = (document.getElementById('releaseNotes').value || '').trim();
			const forceUpdate = document.getElementById('forceUpdate').checked ? '1' : '0';
			const fileInput = document.getElementById('apk');
			if (!fileInput.files || !fileInput.files[0]) {
				showErr(upMsg, '请选择 APK');
				return;
			}
			const fd = new FormData();
			fd.append('latestVersion', latestVersion);
			fd.append('releaseNotes', releaseNotes);
			fd.append('forceUpdate', forceUpdate);
			fd.append('apk', fileInput.files[0]);
			const submitBtn = ev.target.querySelector('button[type="submit"]');
			if (submitBtn) submitBtn.disabled = true;
			try {
				showOk(upMsg, '上传中，请稍候…');
				await apiJson('/device/app/api/version/admin/upload', {
					method: 'POST',
					body: fd
				});
				showOk(upMsg, '上传成功，已写入 version 表。');
				document.getElementById('upForm').reset();
				await refreshList();
			} catch (e) {
				showErr(upMsg, formatFetchError(e));
			} finally {
				if (submitBtn) submitBtn.disabled = false;
			}
		});

		if (AdminCommon.requireAdmin()) {
			document.getElementById('panel').style.display = 'block';
			refreshList();
		}
	})();
	</script>
</body>
</html>
