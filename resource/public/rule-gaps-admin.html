<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>规则缺口</title>
	<link rel="stylesheet" href="/resource/public/pangbao-theme.css" />
	<link rel="stylesheet" href="/resource/public/admin-pages.css" />
	<style>
		.hint { font-size: 12px; color: #64748b; line-height: 1.55; margin: 0 0 14px; }
		.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
		.filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #334155; }
		.filters input, .filters select { font-size: 13px; padding: 6px 8px; min-width: 120px; }
		.table-wrap { overflow-x: auto; }
		table { width: 100%; border-collapse: collapse; font-size: 12px; }
		th, td { border-bottom: 1px solid rgba(0,0,0,.06); padding: 8px 6px; text-align: left; vertical-align: top; }
		th.num, td.num { width: 40px; text-align: right; color: #64748b; }
		td.clip { max-width: 200px; word-break: break-all; }
		td.reason { max-width: 180px; word-break: break-all; }
		.badge-open { color: #059669; font-weight: 600; }
		.badge-done { color: #94a3b8; font-weight: 600; }
		.pager { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; font-size: 12px; color: #64748b; }
	</style>
</head>
<body>
<div class="page">
	<header class="admin-header glass">
		<div class="logo">Gap</div>
		<div>
			<h1>规则缺口</h1>
			<p>多维本地规则未覆盖收件箱 · <a href="/device/admin">运维 Hub</a> · 与<a href="/device/admin/intent-vector-admin.html">意图向量</a>并列</p>
		</div>
	</header>
	<div class="card glass hidden" id="mainCard">
		<p class="hint">
			数据来自 Python 卷 <code>data/rule_gaps/gaps.jsonl</code>（经 voice 代理 <code>/v1/admin/rule-gaps</code>）。
			本页仅供浏览与标已处理；<strong>整理规则须改 Python 代码发版，非热更新</strong>，也不会写入事件向量库。
			静态页样式不对请 <strong>Ctrl+F5</strong>。
		</p>
		<div class="filters">
			<label>维度
				<input id="fltDim" type="text" placeholder="空=全部，如 time/event" />
			</label>
			<label>状态
				<select id="fltStatus">
					<option value="open" selected>open</option>
					<option value="dismissed">dismissed</option>
					<option value="">全部</option>
				</select>
			</label>
			<button id="reloadBtn" type="button">查询</button>
			<button id="prevBtn" type="button" class="secondary">上一页</button>
			<button id="nextBtn" type="button" class="secondary">下一页</button>
			<span id="listMeta"></span>
		</div>
		<div class="table-wrap">
			<table>
				<thead>
					<tr>
						<th class="num">#</th>
						<th>维度</th>
						<th>段原文</th>
						<th>整句</th>
						<th>原因</th>
						<th>LLM</th>
						<th>设备</th>
						<th>时间</th>
						<th>状态</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody id="listBody"></tbody>
			</table>
		</div>
		<div class="pager" id="pagerMeta"></div>
		<div id="mainMsg" class="msg"></div>
	</div>
	<div class="card glass" id="gateCard">
		<p>请先打开 <a href="/device/admin">运维 Hub</a> 登录后再访问本页。</p>
	</div>
</div>
<script src="/resource/public/admin-common.js"></script>
<script>
(async function () {
	const LIMIT = 100;
	let offset = 0;
	let total = 0;

	function api(path, options) { return AdminCommon.adminFetch(path, options); }
	function setMsg(text, ok) {
		const el = document.getElementById('mainMsg');
		el.textContent = text || '';
		el.style.color = ok === false ? '#dc2626' : (ok ? '#16a34a' : '#64748b');
	}
	function esc(s) {
		return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
			({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
	}
	function yn(v) {
		if (v === true || v === 'true' || v === 1) return '是';
		if (v === false || v === 'false' || v === 0) return '否';
		return '—';
	}

	async function loadList() {
		setMsg('加载中…');
		const dim = (document.getElementById('fltDim').value || '').trim();
		const st = document.getElementById('fltStatus').value;
		const qs = new URLSearchParams();
		qs.set('offset', String(offset));
		qs.set('limit', String(LIMIT));
		if (dim) qs.set('dimension', dim);
		// status= 空串表示不过滤；须显式带参数覆盖服务端默认 open
		qs.set('status', st);
		const d = await api('/voice/admin/api/rule-gaps?' + qs.toString());
		total = Number(d.total) || 0;
		const items = d.items || [];
		const body = document.getElementById('listBody');
		body.innerHTML = items.map((it, i) => {
			const id = it.id || '';
			const stLabel = (it.status === 'open')
				? '<span class="badge-open">open</span>'
				: '<span class="badge-done">' + esc(it.status || '—') + '</span>';
			const canDismiss = it.status === 'open';
			const op = canDismiss
				? '<button type="button" class="secondary dismiss-btn" data-id="' + esc(id) + '">标已处理</button>'
				: '—';
			const llmCell = yn(it.llm_used) + (it.llm_result ? '<br/><span class="clip">' + esc(String(it.llm_result).slice(0, 120)) + '</span>' : '');
			return '<tr>' +
				'<td class="num">' + (offset + i + 1) + '</td>' +
				'<td><code>' + esc(it.dimension) + '</code></td>' +
				'<td class="clip">' + esc(it.segment_text) + '</td>' +
				'<td class="clip">' + esc(it.utterance) + '</td>' +
				'<td class="reason">' + esc(it.reason) + (it.rule_result ? '<br/><code>' + esc(it.rule_result) + '</code>' : '') + '</td>' +
				'<td>' + llmCell + '</td>' +
				'<td><code>' + esc(it.device_no || '—') + '</code></td>' +
				'<td>' + esc(it.created_at || '—') + '</td>' +
				'<td>' + stLabel + '</td>' +
				'<td>' + op + '</td>' +
				'</tr>';
		}).join('') || '<tr><td colspan="10">暂无记录（检查 Python 服务与 data/rule_gaps/gaps.jsonl）</td></tr>';

		body.querySelectorAll('.dismiss-btn').forEach(btn => {
			btn.onclick = async () => {
				const id = btn.getAttribute('data-id');
				if (!id) return;
				if (!confirm('将缺口 ' + id + ' 标为 dismissed？')) return;
				try {
					await api('/voice/admin/api/rule-gaps/' + encodeURIComponent(id), {
						method: 'PATCH',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ status: 'dismissed' })
					});
					setMsg('已标为 dismissed', true);
					await loadList();
				} catch (e) { setMsg(String(e && e.message || e), false); }
			};
		});

		const from = total === 0 ? 0 : offset + 1;
		const to = Math.min(offset + LIMIT, total);
		document.getElementById('listMeta').textContent = '共 ' + total + ' 条';
		document.getElementById('pagerMeta').textContent = '本页 ' + from + '-' + to;
		document.getElementById('prevBtn').disabled = offset <= 0;
		document.getElementById('nextBtn').disabled = offset + LIMIT >= total;
		setMsg('已刷新', true);
	}

	try {
		await AdminCommon.requireAdmin();
		document.getElementById('gateCard').classList.add('hidden');
		document.getElementById('mainCard').classList.remove('hidden');
	} catch (e) { return; }

	document.getElementById('reloadBtn').onclick = () => {
		offset = 0;
		loadList().catch(e => setMsg(String(e && e.message || e), false));
	};
	document.getElementById('prevBtn').onclick = () => {
		offset = Math.max(0, offset - LIMIT);
		loadList().catch(e => setMsg(String(e && e.message || e), false));
	};
	document.getElementById('nextBtn').onclick = () => {
		if (offset + LIMIT >= total) return;
		offset += LIMIT;
		loadList().catch(e => setMsg(String(e && e.message || e), false));
	};

	await loadList().catch(e => setMsg(String(e && e.message || e), false));
})();
</script>
</body>
</html>
