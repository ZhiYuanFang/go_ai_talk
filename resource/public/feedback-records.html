<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>用户反馈 — 设备管理</title>
	<style>
		body{font-family:Arial,Helvetica,sans-serif;background:#f7f8fa;color:#222;margin:0;padding:24px}
		.card{background:#fff;border-radius:12px;padding:16px;max-width:960px;margin:0 auto 16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
		input,textarea,button{padding:10px 12px;border-radius:8px;border:1px solid #d0d7de;font-size:14px}
		textarea{resize:vertical;min-height:72px;width:100%;box-sizing:border-box}
		button{background:#1677ff;color:#fff;border:none;cursor:pointer}
		button:disabled{background:#9bbcf5;cursor:not-allowed}
		a.link-btn{display:inline-block;padding:10px 12px;border-radius:8px;font-size:14px;background:#6b7280;color:#fff;text-decoration:none;line-height:1.2}
		a.link-btn:hover{background:#4b5563}
		.table-wrap{overflow-x:auto;margin-top:12px}
		table{width:max-content;min-width:100%;border-collapse:collapse}
		th,td{border-bottom:1px solid #eee;padding:10px;text-align:left;font-size:13px;vertical-align:top}
		td.wrapcell{white-space:normal;max-width:320px;word-break:break-word}
		.card-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:12px}
		.card-head h3{margin:0;font-size:1.1em;font-weight:600}
		.card-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
		.hidden{display:none}
		.msg{margin-top:8px;font-size:13px}
		.pager{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:13px}
		.pager span{color:#64748b}
		.reply-box{margin-top:8px;display:flex;flex-direction:column;gap:8px}
		.muted{color:#64748b;font-size:12px}
		label.filter{display:inline-flex;align-items:center;gap:6px;font-size:13px}
	</style>
</head>
<body>
	<div class="card" id="loginCard">
		<h3>用户反馈 — 登录</h3>
		<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
			<input id="pwd" type="password" placeholder="请输入管理口令" />
			<button id="loginBtn" type="button">登录</button>
			<a class="link-btn" href="/device/admin">返回设备管理</a>
		</div>
		<div id="loginMsg" class="msg"></div>
	</div>

	<div class="card hidden" id="mainCard">
		<div class="card-head">
			<h3>用户反馈</h3>
			<div class="card-actions">
				<label class="filter"><input id="unrepliedOnly" type="checkbox" /> 仅未回复</label>
				<button id="refreshBtn" type="button">刷新</button>
				<a class="link-btn" href="/device/admin">返回设备管理</a>
			</div>
		</div>
		<div id="mainMsg" class="msg"></div>
		<div class="table-wrap">
			<table>
				<thead>
					<tr>
						<th>ID</th>
						<th>用户 wxId</th>
						<th>问题</th>
						<th>官方回复</th>
						<th>提交时间</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody id="feedbackTbody"></tbody>
			</table>
		</div>
		<div class="pager">
			<button id="prevBtn" type="button">上一页</button>
			<button id="nextBtn" type="button">下一页</button>
			<span id="pagerInfo"></span>
		</div>
	</div>

<script>
let adminPwd = '';
let currentPage = 1;
const pageSize = 20;

const loginCard = document.getElementById('loginCard');
const mainCard = document.getElementById('mainCard');
const loginMsg = document.getElementById('loginMsg');
const mainMsg = document.getElementById('mainMsg');
const feedbackTbody = document.getElementById('feedbackTbody');
const pagerInfo = document.getElementById('pagerInfo');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const unrepliedOnlyEl = document.getElementById('unrepliedOnly');

function setMsg(el, text, ok){
	el.textContent = text || '';
	el.style.color = ok ? '#0a6' : '#c1121f';
}

function escapeHtml(s){
	return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTime(ts){
	if(!ts) return '';
	const d = new Date(Number(ts) * 1000);
	if(Number.isNaN(d.getTime())) return escapeHtml(ts);
	const pad = n => String(n).padStart(2,'0');
	return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

async function api(path, options={}){
	const headers = Object.assign({'Content-Type':'application/json','X-Admin-Password':adminPwd}, options.headers || {});
	const res = await fetch(path, Object.assign({}, options, {headers}));
	const data = await res.json().catch(() => ({}));
	if(!res.ok || data.code !== 0){ throw new Error(data.message || ('HTTP '+res.status)); }
	return data.data;
}

function asPagedListPayload(d){
	const list = Array.isArray(d) ? d : (d && Array.isArray(d.list) ? d.list : []);
	const total = d && typeof d.total === 'number' ? d.total : list.length;
	const page = d && typeof d.page === 'number' ? d.page : currentPage;
	const ps = d && typeof d.pageSize === 'number' ? d.pageSize : pageSize;
	return { list, total, page, pageSize: ps };
}

async function loadFeedbackPage(page){
	const unreplied = unrepliedOnlyEl && unrepliedOnlyEl.checked ? '&unrepliedOnly=true' : '';
	const paged = asPagedListPayload(await api('/device/admin/api/feedback/list?page='+page+'&pageSize='+pageSize+unreplied));
	currentPage = paged.page || page;
	feedbackTbody.innerHTML = '';
	(paged.list || []).forEach(it => {
		const id = it.id || 0;
		const status = Number(it.status || 0);
		const tr = document.createElement('tr');
		const replyCell = status === 1
			? '<td class="wrapcell">'+ escapeHtml(it.officialReply||'') +'</td>'
			: '<td class="wrapcell muted">待回复</td>';
		tr.innerHTML = '<td>'+ escapeHtml(id) +'</td>' +
			'<td>'+ escapeHtml(it.wxId ?? '') +'</td>' +
			'<td class="wrapcell">'+ escapeHtml(it.question||'') +'</td>' +
			replyCell +
			'<td>'+ formatTime(it.createdAt) +'</td>' +
			'<td class="action-cell"></td>';
		const actionCell = tr.querySelector('.action-cell');
		if(status === 0){
			const box = document.createElement('div');
			box.className = 'reply-box';
			const ta = document.createElement('textarea');
			ta.placeholder = '输入官方回复…';
			const btn = document.createElement('button');
			btn.type = 'button';
			btn.textContent = '提交回复';
			btn.addEventListener('click', async () => {
				const text = ta.value.trim();
				if(!text){ setMsg(mainMsg, '回复不能为空'); return; }
				btn.disabled = true;
				try {
					await api('/device/admin/api/feedback/reply', {
						method: 'POST',
						body: JSON.stringify({ id: Number(id), officialReply: text })
					});
					setMsg(mainMsg, '回复成功', true);
					await loadFeedbackPage(currentPage);
				} catch (e) {
					setMsg(mainMsg, e.message || '回复失败');
					btn.disabled = false;
				}
			});
			box.appendChild(ta);
			box.appendChild(btn);
			actionCell.appendChild(box);
		} else {
			actionCell.innerHTML = '<span class="muted">已回复</span>';
		}
		feedbackTbody.appendChild(tr);
	});
	const totalPages = Math.max(1, Math.ceil((paged.total || 0) / (paged.pageSize || pageSize)));
	pagerInfo.textContent = '第 '+ currentPage +' / '+ totalPages +' 页，共 '+ (paged.total||0) +' 条';
	prevBtn.disabled = currentPage <= 1;
	nextBtn.disabled = currentPage >= totalPages;
}

document.getElementById('loginBtn').addEventListener('click', async () => {
	adminPwd = document.getElementById('pwd').value.trim();
	if(!adminPwd){ setMsg(loginMsg, '请输入口令'); return; }
	try {
		await loadFeedbackPage(1);
		loginCard.classList.add('hidden');
		mainCard.classList.remove('hidden');
		setMsg(mainMsg, '登录成功', true);
	} catch (e) {
		setMsg(loginMsg, e.message || '口令错误');
	}
});

document.getElementById('refreshBtn').addEventListener('click', async () => {
	try { await loadFeedbackPage(currentPage); setMsg(mainMsg, '已刷新', true); }
	catch (e) { setMsg(mainMsg, e.message || '刷新失败'); }
});

if(unrepliedOnlyEl){
	unrepliedOnlyEl.addEventListener('change', async () => {
		try { await loadFeedbackPage(1); }
		catch (e) { setMsg(mainMsg, e.message || '加载失败'); }
	});
}

prevBtn.addEventListener('click', async () => {
	if(currentPage <= 1) return;
	try { await loadFeedbackPage(currentPage - 1); }
	catch (e) { setMsg(mainMsg, e.message || '加载失败'); }
});

nextBtn.addEventListener('click', async () => {
	try { await loadFeedbackPage(currentPage + 1); }
	catch (e) { setMsg(mainMsg, e.message || '加载失败'); }
});
</script>
</body>
</html>
