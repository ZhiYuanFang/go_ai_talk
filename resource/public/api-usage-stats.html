<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>功能使用统计 — 设备管理</title>
	<link rel="stylesheet" href="/resource/public/pangbao-theme.css" />
	<link rel="stylesheet" href="/resource/public/admin-pages.css" />
</head>
<body>
<div class="page">
	<header class="admin-header glass">
		<div class="logo">API</div>
		<div>
			<h1>App API 使用统计</h1>
			<p>按接口与用户维度查看调用量</p>
		</div>
	</header>
	<div class="card glass hidden" id="mainCard">
		<div class="card-head">
			<h3>统计概览</h3>
			<div class="card-actions">
				<label>时间范围
					<select id="daysSelect">
						<option value="7" selected>近 7 天</option>
						<option value="30">近 30 天</option>
						<option value="0">全部（90 天内）</option>
					</select>
				</label>
				<button id="refreshBtn" type="button">刷新</button>
				<a class="link-btn" href="/device/admin">返回设备管理</a>
			</div>
		</div>
		<div class="card-actions" style="margin-bottom:12px;">
			<button id="tabApiBtn" type="button" class="tab-btn active">按 API</button>
			<button id="tabUserBtn" type="button" class="tab-btn">按用户</button>
		</div>
		<p class="hint">仅统计经 App 网关的 HTTP 2xx 成功请求。用户维度仅包含已登录账号（wxId &gt; 0）。</p>
		<div id="mainMsg" class="msg"></div>

		<div id="apiPanel">
			<div class="table-wrap">
				<table>
					<thead>
						<tr>
							<th>API</th>
							<th>中文说明</th>
							<th>调用次数</th>
							<th>最近调用</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody id="apiTbody"></tbody>
				</table>
			</div>
			<div id="apiDetailPanel" class="detail-panel hidden">
				<h4 id="apiDetailTitle"></h4>
				<div class="table-wrap">
					<table>
						<thead>
							<tr><th>wxId</th><th>次数</th><th>最近调用</th></tr>
						</thead>
						<tbody id="apiDetailTbody"></tbody>
					</table>
				</div>
			</div>
		</div>

		<div id="userPanel" class="hidden">
			<div class="card-actions">
				<input id="wxIdInput" placeholder="输入 wxId" />
				<button id="userSearchBtn" type="button">查询</button>
			</div>
			<div class="table-wrap" style="margin-top:12px;">
				<table>
					<thead>
						<tr>
							<th>API</th>
							<th>中文说明</th>
							<th>调用次数</th>
							<th>最近调用</th>
						</tr>
					</thead>
					<tbody id="userTbody"></tbody>
				</table>
			</div>
		</div>
	</div>

<script src="/resource/public/admin-common.js"></script>
<script>
let activeTab = 'api';

const mainCard = document.getElementById('mainCard');
const mainMsg = document.getElementById('mainMsg');
const apiTbody = document.getElementById('apiTbody');
const userTbody = document.getElementById('userTbody');
const apiPanel = document.getElementById('apiPanel');
const userPanel = document.getElementById('userPanel');
const apiDetailPanel = document.getElementById('apiDetailPanel');
const apiDetailTbody = document.getElementById('apiDetailTbody');
const apiDetailTitle = document.getElementById('apiDetailTitle');

function setMsg(el, text, ok){
	el.textContent = text || '';
	el.style.color = ok ? '#0a6' : '#c1121f';
}

function escapeHtml(s){
	return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTime(ts){
	const n = Number(ts);
	if(!n) return '-';
	const d = new Date(n * 1000);
	if(isNaN(d.getTime())) return '-';
	return d.toLocaleString('zh-CN', { hour12: false });
}

function daysParam(){
	return document.getElementById('daysSelect').value;
}

function api(path, options={}){ return AdminCommon.adminFetch(path, options); }

async function loadApiList(){
	const d = await api('/device/admin/api/usage/list?days='+encodeURIComponent(daysParam()));
	apiTbody.innerHTML = '';
	apiDetailPanel.classList.add('hidden');
	(d.list || []).forEach(it => {
		const tr = document.createElement('tr');
		tr.innerHTML =
			'<td class="wrapcell">'+ escapeHtml(it.apiKey||'') +'</td>' +
			'<td>'+ escapeHtml(it.summary||'') +'</td>' +
			'<td>'+ escapeHtml(it.count ?? 0) +'</td>' +
			'<td>'+ escapeHtml(formatTime(it.lastAt)) +'</td>' +
			'<td><button type="button" class="drill-btn">下钻</button></td>';
		tr.querySelector('.drill-btn').addEventListener('click', () => loadApiDetail(it.apiKey, it.summary));
		apiTbody.appendChild(tr);
	});
	setMsg(mainMsg, '已加载 '+ (d.list||[]).length +' 条 API', true);
}

async function loadApiDetail(apiKey, summary){
	const d = await api('/device/admin/api/usage/detail?apiKey='+encodeURIComponent(apiKey)+'&days='+encodeURIComponent(daysParam()));
	apiDetailTitle.textContent = (summary || '') + ' — ' + apiKey;
	apiDetailTbody.innerHTML = '';
	(d.list || []).forEach(it => {
		const tr = document.createElement('tr');
		tr.innerHTML =
			'<td>'+ escapeHtml(it.wxId) +'</td>' +
			'<td>'+ escapeHtml(it.count ?? 0) +'</td>' +
			'<td>'+ escapeHtml(formatTime(it.lastAt)) +'</td>';
		apiDetailTbody.appendChild(tr);
	});
	apiDetailPanel.classList.remove('hidden');
}

async function loadUserApis(){
	const wxId = document.getElementById('wxIdInput').value.trim();
	if(!wxId){ setMsg(mainMsg, '请输入 wxId'); return; }
	const d = await api('/device/admin/api/usage/user?wxId='+encodeURIComponent(wxId)+'&days='+encodeURIComponent(daysParam()));
	userTbody.innerHTML = '';
	(d.list || []).forEach(it => {
		const tr = document.createElement('tr');
		tr.innerHTML =
			'<td class="wrapcell">'+ escapeHtml(it.apiKey||'') +'</td>' +
			'<td>'+ escapeHtml(it.summary||'') +'</td>' +
			'<td>'+ escapeHtml(it.count ?? 0) +'</td>' +
			'<td>'+ escapeHtml(formatTime(it.lastAt)) +'</td>';
		userTbody.appendChild(tr);
	});
	setMsg(mainMsg, 'wxId '+ wxId +' 共 '+ (d.list||[]).length +' 个 API', true);
}

function switchTab(tab){
	activeTab = tab;
	document.getElementById('tabApiBtn').classList.toggle('active', tab === 'api');
	document.getElementById('tabUserBtn').classList.toggle('active', tab === 'user');
	apiPanel.classList.toggle('hidden', tab !== 'api');
	userPanel.classList.toggle('hidden', tab !== 'user');
}

document.getElementById('refreshBtn').addEventListener('click', async () => {
	try {
		if(activeTab === 'api') await loadApiList();
		else await loadUserApis();
	} catch (e) {
		setMsg(mainMsg, e.message || '刷新失败');
	}
});

document.getElementById('daysSelect').addEventListener('change', async () => {
	try {
		if(activeTab === 'api') await loadApiList();
		else await loadUserApis();
	} catch (e) {
		setMsg(mainMsg, e.message || '加载失败');
	}
});

document.getElementById('tabApiBtn').addEventListener('click', () => switchTab('api'));
document.getElementById('tabUserBtn').addEventListener('click', () => switchTab('user'));
document.getElementById('userSearchBtn').addEventListener('click', loadUserApis);

if(AdminCommon.requireAdmin()){
	mainCard.classList.remove('hidden');
	loadApiList().catch(e => setMsg(mainMsg, e.message || '加载失败'));
}
</script>
</div>
</body>
</html>
