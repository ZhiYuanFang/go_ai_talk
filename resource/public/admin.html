<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>设备管理</title>
	<style>
		body{font-family:Arial,Helvetica,sans-serif;background:#f7f8fa;color:#222;margin:0;padding:24px}
		.card{background:#fff;border-radius:12px;padding:16px;max-width:960px;margin:0 auto 16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
		input,button,textarea,select{padding:10px 12px;border-radius:8px;border:1px solid #d0d7de;font-size:14px}
		select{min-width:200px;background:#fff}
		textarea{min-height:72px;resize:vertical;font-family:inherit}
		button{background:#1677ff;color:#fff;border:none;cursor:pointer}
		button:disabled{background:#9bbcf5;cursor:not-allowed}
		.table-wrap{overflow-x:auto;margin-top:12px}
		table{width:max-content;min-width:100%;border-collapse:collapse}
		th,td{border-bottom:1px solid #eee;padding:10px;text-align:left;font-size:13px}
		th.td-check,td.td-check{text-align:center;width:3em;white-space:nowrap}
		td.wrapcell{white-space:normal;max-width:360px;word-break:break-word;vertical-align:middle}
		.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
		.card-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:12px}
		.card-head h3{margin:0;font-size:1.1em;font-weight:600;line-height:1.3}
		.card-head .card-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
		.hidden{display:none}
		.msg{margin-top:8px;font-size:13px}
		.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:99}
		.modal.show{display:flex}
		.modal-card{background:#fff;border-radius:12px;padding:16px;min-width:320px;max-width:640px;width:90%;box-shadow:0 10px 30px rgba(0,0,0,.15)}
	</style>
</head>
<body>
	<div class="card" id="loginCard">
		<h3>设备管理登录</h3>
		<div class="row">
			<input id="pwd" type="password" placeholder="请输入口令" />
			<button id="loginBtn">进入</button>
		</div>
		<div id="loginMsg" class="msg"></div>
	</div>

	<div class="card hidden" id="mainCard">
		<div class="card-head">
			<h3>注册设备</h3>
			<div class="card-actions">
				<input id="deviceNo" placeholder="device_no" />
				<button id="registerBtn" type="button">注册</button>
				<button id="refreshBtn" type="button">刷新列表</button>
			</div>
		</div>
		<div id="mainMsg" class="msg"></div>
		<div class="table-wrap">
			<table>
				<thead>
					<tr>
						<th>device_no</th>
						<th>active_time</th>
						<th>last_talk_time</th>
						<th>last_talk_ask</th>
						<th>last_talk_answer</th>
					</tr>
				</thead>
				<tbody id="tbody"></tbody>
			</table>
		</div>
	</div>

	<div class="card hidden" id="eventCard">
		<div class="card-head">
			<h3>事件管理</h3>
			<div class="card-actions">
				<button id="addEventBtn" type="button">新增事件</button>
				<button id="refreshEventBtn" type="button">刷新</button>
			</div>
		</div>
		<div id="eventMsg" class="msg"></div>
		<div class="table-wrap">
			<table>
				<thead>
					<tr>
						<th>ID</th>
						<th>事件名称</th>
						<th class="td-check">需要计数</th>
						<th>事件扩展</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody id="eventTbody"></tbody>
			</table>
		</div>
	</div>

	<div class="card hidden" id="qaCard">
		<div class="card-head">
			<h3>历史记录（问答库）</h3>
			<div class="card-actions">
				<button id="refreshQaBtn" type="button">刷新</button>
			</div>
		</div>
		<div id="qaMsg" class="msg"></div>
		<div class="table-wrap">
			<table>
				<thead>
					<tr>
						<th>ID</th>
						<th>问题</th>
						<th>回复</th>
						<th>命中次数</th>
					</tr>
				</thead>
				<tbody id="qaTbody"></tbody>
			</table>
		</div>
	</div>

	<div class="card hidden" id="actionCard">
		<div class="card-head">
			<h3>动作预设</h3>
			<div class="card-actions">
				<button id="refreshActionBtn" type="button">刷新</button>
			</div>
		</div>
		<div id="actionMsg" class="msg"></div>
		<div class="table-wrap">
			<table>
				<thead>
					<tr>
						<th>ID</th>
						<th>动作名</th>
						<th>动作目标</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody id="actionTbody"></tbody>
			</table>
		</div>
	</div>

	<div id="eventModal" class="modal">
		<div class="modal-card">
			<h3 id="eventModalTitle">新增事件</h3>
			<div class="row">
				<input id="eventFormName" placeholder="例如：吃奶 / 睡觉 / 换尿布" style="flex:1;min-width:220px;" />
				<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#444;">
					<input id="eventFormNeedQuantity" type="checkbox" />
					需要计数
				</label>
			</div>
			<div style="margin-top:10px;">
				<div style="font-size:13px;color:#444;margin-bottom:6px;">事件扩展（别名等，可选）</div>
				<textarea id="eventFormExtraNames" placeholder="多个别名可用逗号、顿号等分隔" style="width:100%;box-sizing:border-box;"></textarea>
			</div>
			<div class="row" style="margin-top:10px;">
				<button id="eventFormSubmitBtn">提交</button>
				<button id="eventFormCancelBtn" style="background:#6b7280;">取消</button>
			</div>
			<div id="eventFormMsg" class="msg"></div>
		</div>
	</div>

	<div id="actionModal" class="modal">
		<div class="modal-card">
			<h3 id="actionModalTitle">编辑动作</h3>
			<div class="row" style="flex-direction:column;align-items:stretch;gap:10px;">
				<div>
					<div style="font-size:13px;color:#444;margin-bottom:6px;">动作名</div>
					<input id="actionFormName" type="text" placeholder="动作名" style="width:100%;box-sizing:border-box;" />
				</div>
				<div>
					<div style="font-size:13px;color:#444;margin-bottom:6px;">动作目标</div>
					<select id="actionFormTargetType" style="width:100%;box-sizing:border-box;"></select>
					<div style="font-size:12px;color:#666;margin-top:6px;">与语音服务中的目标类型一致；若库中为自定义值，下拉中会多出一项「当前值」。</div>
				</div>
			</div>
			<div class="row" style="margin-top:14px;">
				<button id="actionFormSubmitBtn" type="button">保存</button>
				<button id="actionFormCancelBtn" type="button" style="background:#6b7280;">取消</button>
			</div>
			<div id="actionFormMsg" class="msg"></div>
		</div>
	</div>

<script>
let adminPwd = "";
const loginCard = document.getElementById('loginCard');
const mainCard = document.getElementById('mainCard');
const eventCard = document.getElementById('eventCard');
const qaCard = document.getElementById('qaCard');
const actionCard = document.getElementById('actionCard');
const loginMsg = document.getElementById('loginMsg');
const mainMsg = document.getElementById('mainMsg');
const eventMsg = document.getElementById('eventMsg');
const qaMsg = document.getElementById('qaMsg');
const actionMsg = document.getElementById('actionMsg');
const eventModal = document.getElementById('eventModal');
const eventModalTitle = document.getElementById('eventModalTitle');
const eventFormName = document.getElementById('eventFormName');
const eventFormNeedQuantity = document.getElementById('eventFormNeedQuantity');
const eventFormExtraNames = document.getElementById('eventFormExtraNames');
const eventFormMsg = document.getElementById('eventFormMsg');
const eventFormSubmitBtn = document.getElementById('eventFormSubmitBtn');
const eventFormCancelBtn = document.getElementById('eventFormCancelBtn');
const actionModal = document.getElementById('actionModal');
const actionModalTitle = document.getElementById('actionModalTitle');
const actionFormName = document.getElementById('actionFormName');
const actionFormTargetType = document.getElementById('actionFormTargetType');
const actionFormMsg = document.getElementById('actionFormMsg');
const actionFormSubmitBtn = document.getElementById('actionFormSubmitBtn');
const actionFormCancelBtn = document.getElementById('actionFormCancelBtn');
let eventFormMode = 'add';
let editingEventId = 0;
let editingActionId = 0;

/** 管理端可选动作目标（不含 conversation/对话） */
const ACTION_TARGET_PRESETS = [
	['start', '开始记录计时'],
	['end', '结束记录计时'],
	['one', '一次性记录'],
	['exit', '退出'],
	['suggest', '成长建议'],
	['search', '搜索']
];

function fillActionTargetSelect(currentRaw){
	const current = String(currentRaw || '').trim();
	const sel = actionFormTargetType;
	sel.innerHTML = '';
	let matched = false;
	ACTION_TARGET_PRESETS.forEach(([val, label]) => {
		const opt = document.createElement('option');
		opt.value = val;
		opt.textContent = label + ' (' + val + ')';
		sel.appendChild(opt);
		if (val === current) matched = true;
	});
	if (current && !matched) {
		const opt = document.createElement('option');
		opt.value = current;
		opt.textContent = '当前值: ' + current;
		sel.insertBefore(opt, sel.firstChild);
	}
	sel.value = current || (ACTION_TARGET_PRESETS[0] ? ACTION_TARGET_PRESETS[0][0] : '');
}

function setMsg(el, msg, ok=false){ el.textContent = msg || ''; el.style.color = ok ? '#0a7f2e' : '#c1121f'; }

function escapeHtml(s){
	return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/** 动作目标：中文说明 + (枚举值)，与列表接口 targetTypeLabel / targetType 一致 */
function formatActionTargetHtml(targetTypeLabel, targetType){
	const tt = String(targetType || '').trim();
	const zh = String(targetTypeLabel != null && String(targetTypeLabel).trim() !== '' ? targetTypeLabel : tt);
	if (!tt) return escapeHtml(zh);
	return escapeHtml(zh) + ' <span style="color:#64748b;font-size:12px;">(' + escapeHtml(tt) + ')</span>';
}

async function api(path, options={}){
	const headers = Object.assign({'Content-Type':'application/json','X-Admin-Password':adminPwd}, options.headers || {});
	const res = await fetch(path, Object.assign({}, options, {headers}));
	const data = await res.json().catch(() => ({}));
	if(!res.ok || data.code !== 0){ throw new Error(data.message || ('HTTP '+res.status)); }
	return data.data;
}

/** 列表类接口 data 为 { list: [...] }（GoFrame 标准结构） */
function asListPayload(d){
	if (Array.isArray(d)) return d;
	if (d && Array.isArray(d.list)) return d.list;
	return [];
}

function formatUnixLocal(sec){
	const n = Number(sec);
	if(!n) return '';
	try{ return new Date(n * 1000).toLocaleString(); }catch(_){ return String(sec); }
}

async function loadList(){
	const data = asListPayload(await api('/device/admin/api/list'));
	const tbody = document.getElementById('tbody');
	tbody.innerHTML = '';
	(data || []).forEach(it => {
		const tr = document.createElement('tr');
		tr.innerHTML = '<td>'+ escapeHtml(it.deviceNo||'') +'</td>' +
			'<td>'+ escapeHtml(formatUnixLocal(it.activeTime)) +'</td>' +
			'<td>'+ escapeHtml(formatUnixLocal(it.lastTalkTime)) +'</td>' +
			'<td class="wrapcell">'+ escapeHtml(it.lastTalkAsk||'') +'</td>' +
			'<td class="wrapcell">'+ escapeHtml(it.lastTalkAnswer||'') +'</td>';
		tbody.appendChild(tr);
	});
}

async function loadEventList(){
	const data = asListPayload(await api('/device/admin/api/event/list'));
	const tbody = document.getElementById('eventTbody');
	tbody.innerHTML = '';
	(data || []).forEach(it => {
		const needQ = Number(it.needQuantity||0) > 0;
		const tr = document.createElement('tr');
		const id = it.id||0;
		const name = it.name||'';
		const extra = it.extraNames||'';
		tr.innerHTML = '<td>'+ escapeHtml(id) +'</td>' +
			'<td>'+ escapeHtml(name) +'</td>' +
			'<td class="td-check">'+ (needQ ? '√' : '') +'</td>' +
			'<td class="wrapcell">'+ escapeHtml(extra) +'</td>' +
			'<td><button type="button" class="event-edit-btn">编辑</button> ' +
			'<button type="button" class="event-del-btn" style="background:#b91c1c;">删除</button></td>';
		tr.querySelector('.event-edit-btn').addEventListener('click', () => {
			eventFormMode = 'edit';
			editingEventId = Number(id);
			eventModalTitle.textContent = '编辑事件';
			eventFormName.value = name;
			eventFormNeedQuantity.checked = needQ;
			eventFormExtraNames.value = extra;
			eventFormMsg.textContent = '';
			eventModal.classList.add('show');
		});
		tr.querySelector('.event-del-btn').addEventListener('click', async () => {
			if (!window.confirm('确定删除该事件？若其它数据仍引用该事件可能删除失败。')) return;
			try {
				await api('/device/admin/api/event/delete', { method: 'POST', body: JSON.stringify({ id: Number(id) }) });
				setMsg(eventMsg, '已删除', true);
				if (editingEventId === Number(id)) {
					eventModal.classList.remove('show');
				}
				await loadEventList();
			} catch (e) {
				setMsg(eventMsg, e.message || '删除失败');
			}
		});
		tbody.appendChild(tr);
	});
}

async function loadQaList(){
	const data = asListPayload(await api('/device/admin/api/qa/list'));
	const tbody = document.getElementById('qaTbody');
	tbody.innerHTML = '';
	(data || []).forEach(it => {
		const tr = document.createElement('tr');
		tr.innerHTML = '<td>'+ escapeHtml(it.id||'') +'</td>' +
			'<td class="wrapcell">'+ escapeHtml(it.question||'') +'</td>' +
			'<td class="wrapcell">'+ escapeHtml(it.replay||'') +'</td>' +
			'<td>'+ escapeHtml(it.attack ?? '') +'</td>';
		tbody.appendChild(tr);
	});
}

async function loadActionList(){
	const data = asListPayload(await api('/device/admin/api/action/list'));
	const tbody = document.getElementById('actionTbody');
	tbody.innerHTML = '';
	(data || []).forEach(it => {
		const tr = document.createElement('tr');
		const id = it.id || 0;
		const name = it.name || '';
		const tt = it.targetType || '';
		tr.innerHTML = '<td>'+ escapeHtml(id) +'</td>' +
			'<td>'+ escapeHtml(name) +'</td>' +
			'<td class="wrapcell">'+ formatActionTargetHtml(it.targetTypeLabel, tt) +'</td>' +
			'<td><button type="button" class="action-edit-btn">编辑</button> ' +
			'<button type="button" class="action-del-btn" style="background:#b91c1c;">删除</button></td>';
		tr.querySelector('.action-edit-btn').addEventListener('click', () => {
			editingActionId = Number(id);
			actionModalTitle.textContent = '编辑动作 #' + id;
			actionFormName.value = name;
			fillActionTargetSelect(tt);
			actionFormMsg.textContent = '';
			actionModal.classList.add('show');
		});
		tr.querySelector('.action-del-btn').addEventListener('click', async () => {
			if (!window.confirm('确定删除该动作预设？此操作不可恢复。')) return;
			try {
				await api('/device/admin/api/action/delete', { method: 'POST', body: JSON.stringify({ id: Number(id) }) });
				setMsg(actionMsg, '已删除', true);
				if (editingActionId === Number(id)) {
					actionModal.classList.remove('show');
				}
				await loadActionList();
			} catch (e) {
				setMsg(actionMsg, e.message || '删除失败');
			}
		});
		tbody.appendChild(tr);
	});
}

document.getElementById('loginBtn').addEventListener('click', async () => {
	adminPwd = document.getElementById('pwd').value.trim();
	if(!adminPwd){ setMsg(loginMsg, '请输入口令'); return; }
	try {
		await loadList();
		await loadEventList();
		await loadQaList();
		await loadActionList();
		loginCard.classList.add('hidden');
		mainCard.classList.remove('hidden');
		eventCard.classList.remove('hidden');
		qaCard.classList.remove('hidden');
		actionCard.classList.remove('hidden');
		setMsg(mainMsg, '登录成功', true);
	} catch (e) {
		setMsg(loginMsg, e.message || '口令错误');
	}
});

document.getElementById('registerBtn').addEventListener('click', async () => {
	const deviceNo = document.getElementById('deviceNo').value.trim();
	if(!deviceNo){ setMsg(mainMsg, 'deviceNo 不能为空'); return; }
	try {
			await api('/device/admin/api/register', {method:'POST', body: JSON.stringify({deviceNo})});
		setMsg(mainMsg, '注册成功', true);
		document.getElementById('deviceNo').value = '';
		await loadList();
	} catch (e) {
		setMsg(mainMsg, e.message || '注册失败');
	}
});

document.getElementById('refreshBtn').addEventListener('click', async () => {
	try { await loadList(); setMsg(mainMsg, '已刷新', true); }
	catch (e) { setMsg(mainMsg, e.message || '刷新失败'); }
});

document.getElementById('refreshEventBtn').addEventListener('click', async () => {
	try { await loadEventList(); setMsg(eventMsg, '已刷新', true); }
	catch (e) { setMsg(eventMsg, e.message || '刷新失败'); }
});

document.getElementById('refreshQaBtn').addEventListener('click', async () => {
	try { await loadQaList(); setMsg(qaMsg, '已刷新', true); }
	catch (e) { setMsg(qaMsg, e.message || '刷新失败'); }
});

document.getElementById('refreshActionBtn').addEventListener('click', async () => {
	try { await loadActionList(); setMsg(actionMsg, '已刷新', true); }
	catch (e) { setMsg(actionMsg, e.message || '刷新失败'); }
});

document.getElementById('addEventBtn').addEventListener('click', async () => {
	eventFormMode = 'add';
	editingEventId = 0;
	eventModalTitle.textContent = '新增事件';
	eventFormName.value = '';
	eventFormNeedQuantity.checked = false;
	eventFormExtraNames.value = '';
	eventFormMsg.textContent = '';
	eventModal.classList.add('show');
});

eventFormCancelBtn.addEventListener('click', () => {
	eventModal.classList.remove('show');
});

eventFormSubmitBtn.addEventListener('click', async () => {
	const name = eventFormName.value.trim();
	const needQuantity = eventFormNeedQuantity.checked ? 1 : 0;
	const extraNames = eventFormExtraNames.value.trim();
	if(!name){ eventFormMsg.textContent = '事件名称不能为空'; eventFormMsg.style.color = '#c1121f'; return; }
	eventFormSubmitBtn.disabled = true;
	eventFormSubmitBtn.textContent = '提交中...';
	try {
		if(eventFormMode === 'edit'){
			await api('/device/admin/api/event/update', {method:'POST', body: JSON.stringify({id: editingEventId, name, needQuantity, extraNames})});
			setMsg(eventMsg, '修改成功', true);
		}else{
			await api('/device/admin/api/event/add', {method:'POST', body: JSON.stringify({name, needQuantity, extraNames})});
			setMsg(eventMsg, '新增成功', true);
		}
		eventModal.classList.remove('show');
		await loadEventList();
	} catch (e) {
		eventFormMsg.textContent = e.message || '提交失败';
		eventFormMsg.style.color = '#c1121f';
	} finally {
		eventFormSubmitBtn.disabled = false;
		eventFormSubmitBtn.textContent = '提交';
	}
});

eventModal.addEventListener('click', (e) => {
	if(e.target === eventModal){
		eventModal.classList.remove('show');
	}
});

actionFormCancelBtn.addEventListener('click', () => {
	actionModal.classList.remove('show');
});

actionFormSubmitBtn.addEventListener('click', async () => {
	const name = actionFormName.value.trim();
	const targetType = actionFormTargetType.value.trim();
	if(!name){ actionFormMsg.textContent = '动作名称不能为空'; actionFormMsg.style.color = '#c1121f'; return; }
	if(!targetType){ actionFormMsg.textContent = '请选择或保留动作目标'; actionFormMsg.style.color = '#c1121f'; return; }
	actionFormSubmitBtn.disabled = true;
	actionFormSubmitBtn.textContent = '保存中...';
	try {
		await api('/device/admin/api/action/update', {
			method: 'POST',
			body: JSON.stringify({ id: editingActionId, name, targetType })
		});
		actionModal.classList.remove('show');
		setMsg(actionMsg, '保存成功', true);
		await loadActionList();
	} catch (e) {
		actionFormMsg.textContent = e.message || '保存失败';
		actionFormMsg.style.color = '#c1121f';
	} finally {
		actionFormSubmitBtn.disabled = false;
		actionFormSubmitBtn.textContent = '保存';
	}
});

actionModal.addEventListener('click', (e) => {
	if(e.target === actionModal){
		actionModal.classList.remove('show');
	}
});
</script>
</body>
</html>
