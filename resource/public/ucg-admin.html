<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>UCG 管理</title>
	<link rel="stylesheet" href="/resource/public/pangbao-theme.css" />
	<link rel="stylesheet" href="/resource/public/admin-pages.css" />
</head>
<body>
<div class="page page-narrow">
	<header class="admin-header glass">
		<div class="logo">UCG</div>
		<div>
			<h1>UCG 管理</h1>
			<p>AI 配置与动态审查 · 须先在 <a href="/device/admin">运维 Hub</a> 登录</p>
		</div>
	</header>
	<div class="card glass hidden" id="mainCard">
		<div class="tabs">
			<button type="button" class="tab active" id="tabAi">AI 配置</button>
			<button type="button" class="tab" id="tabPosts">动态审查</button>
		</div>

		<div id="panelAi">
			<div class="field">
				<label for="visionModel">Vision 模型</label>
				<select id="visionModel"></select>
			</div>
			<div class="field">
				<label for="maxImages">单次润笔最大图片数 (1-9)</label>
				<input id="maxImages" type="number" min="1" max="9" step="1" />
			</div>
			<hr class="divider" />
			<h4 style="margin:0 0 12px;font-size:15px;">AI 月度额度（全局默认）</h4>
			<div class="field">
				<label for="quotaPolishDefault">润笔默认次数/月</label>
				<input id="quotaPolishDefault" type="number" min="1" step="1" />
			</div>
			<div class="field">
				<label for="quotaVoiceDefault">喂养 AI 默认次数/月</label>
				<input id="quotaVoiceDefault" type="number" min="1" step="1" />
			</div>
			<div class="row">
				<button id="saveQuotaDefaultBtn" type="button" class="secondary">保存额度默认</button>
				<span id="quotaDefaultMeta" class="msg" style="color:#64748b;"></span>
			</div>
			<h4 style="margin:16px 0 12px;font-size:15px;">单人 override（wxId）</h4>
			<div class="row">
				<input id="quotaWxId" type="number" min="1" step="1" placeholder="wxId" style="width:140px;" />
				<button id="loadQuotaUserBtn" type="button" class="secondary">加载</button>
			</div>
			<div class="field">
				<label for="quotaPolishUser">润笔 override（留空且勾选清除=走默认）</label>
				<input id="quotaPolishUser" type="number" min="1" step="1" />
				<label style="margin-top:6px;"><input id="quotaClearPolish" type="checkbox" /> 清除润笔 override</label>
			</div>
			<div class="field">
				<label for="quotaVoiceUser">喂养 AI override</label>
				<input id="quotaVoiceUser" type="number" min="1" step="1" />
				<label style="margin-top:6px;"><input id="quotaClearVoice" type="checkbox" /> 清除喂养 override</label>
			</div>
			<div class="row">
				<button id="saveQuotaUserBtn" type="button" class="secondary">保存单人额度</button>
			</div>
			<div id="quotaMsg" class="msg"></div>
			<div class="row">
				<button id="saveBtn" type="button">保存 AI 模型配置</button>
				<span id="meta" class="msg" style="color:#64748b;"></span>
			</div>
			<div id="mainMsg" class="msg"></div>
		</div>

		<div id="panelPosts" class="hidden">
			<div class="row">
				<label style="margin:0;">状态</label>
				<select id="postStatusFilter">
					<option value="">全部</option>
					<option value="0">草稿</option>
					<option value="1">待审</option>
					<option value="2">已发布</option>
					<option value="3">已驳回</option>
				</select>
				<button type="button" class="secondary" id="postsRefreshBtn">刷新</button>
				<button type="button" class="danger" id="postsRejectBtn" disabled>批量驳回</button>
				<span id="postsSelectedHint" class="msg" style="color:#64748b;margin:0;"></span>
			</div>
			<div id="postsMsg" class="msg"></div>
			<table>
				<thead>
					<tr>
						<th><input type="checkbox" id="postsSelectPage" title="全选本页可驳回项" /></th>
						<th>ID</th>
						<th>作者</th>
						<th>内容</th>
						<th>状态</th>
						<th>更新时间</th>
						<th>媒体</th>
					</tr>
				</thead>
				<tbody id="postsTbody"></tbody>
			</table>
			<div class="pager">
				<button type="button" class="secondary" id="postsPrevBtn">上一页</button>
				<span id="postsPagerInfo"></span>
				<button type="button" class="secondary" id="postsNextBtn">下一页</button>
			</div>
		</div>
	</div>

	<div id="mediaPreviewModal" class="modal" role="dialog" aria-modal="true" aria-label="媒体预览">
		<div class="modal-card media-preview-card">
			<div class="media-preview-toolbar">
				<button type="button" class="secondary" id="mediaPreviewClose">关闭</button>
			</div>
			<div id="mediaPreviewImageWrap" class="media-preview-body hidden">
				<img id="mediaPreviewImage" alt="原图预览" />
			</div>
			<div id="mediaPreviewVideoWrap" class="media-preview-body hidden">
				<video id="mediaPreviewVideo" controls playsinline></video>
			</div>
		</div>
	</div>

<script src="/resource/public/admin-common.js"></script>
<script>
let postsPage = 1;
const postsPageSize = 20;
let postsTotal = 0;
let postsRows = [];
const selectedPostIds = new Set();

function api(path, options={}){ return AdminCommon.adminFetch(path, options); }

function showMsg(el, text, ok){
	el.textContent = text || '';
	el.className = 'msg ' + (ok ? 'ok' : (text ? 'err' : ''));
}

function escapeHtml(s){
	return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function postStatusLabel(status){
	switch(Number(status)){
		case 0: return {text:'草稿', cls:'status-draft'};
		case 1: return {text:'待审', cls:'status-pending'};
		case 2: return {text:'已发布', cls:'status-published'};
		case 3: return {text:'已驳回', cls:'status-rejected'};
		default: return {text:String(status), cls:''};
	}
}

function formatUnix(ts){
	if(!ts) return '-';
	return new Date(ts * 1000).toLocaleString();
}

function truncate(s, n){
	const t = String(s || '');
	return t.length > n ? t.slice(0, n) + '…' : t;
}

// 动态审查：渲染帖子全量媒体缩略图（图片/视频区分）。
function renderMediaCell(mediaList){
	const wrap = document.createElement('div');
	wrap.className = 'media-grid';
	const list = mediaList || [];
	if(!list.length){
		wrap.textContent = '-';
		return wrap;
	}
	list.forEach(m => {
		const kind = Number(m.mediaKind);
		const isVideo = kind === 2;
		const thumb = String(m.thumbnailUrl || m.cdnUrl || '').trim();
		const full = String(m.cdnUrl || '').trim();
		if(!thumb && !full) return;
		const btn = document.createElement('button');
		btn.type = 'button';
		btn.className = 'media-thumb-btn' + (isVideo ? ' is-video' : '');
		btn.title = isVideo ? '播放视频' : '查看原图';
		btn.dataset.mediaKind = String(kind);
		btn.dataset.previewUrl = full || thumb;
		const img = document.createElement('img');
		img.className = 'media-thumb';
		img.src = thumb || full;
		img.alt = '';
		img.loading = 'lazy';
		btn.appendChild(img);
		if(isVideo){
			const badge = document.createElement('span');
			badge.className = 'media-play-badge';
			badge.textContent = '▶';
			btn.appendChild(badge);
		}
		wrap.appendChild(btn);
	});
	if(!wrap.children.length) wrap.textContent = '-';
	return wrap;
}

function closeMediaPreview(){
	const modal = document.getElementById('mediaPreviewModal');
	const video = document.getElementById('mediaPreviewVideo');
	video.pause();
	video.removeAttribute('src');
	video.load();
	modal.classList.remove('show');
}

function openMediaPreview(kind, url){
	url = String(url || '').trim();
	if(!url) return;
	const modal = document.getElementById('mediaPreviewModal');
	const imgWrap = document.getElementById('mediaPreviewImageWrap');
	const videoWrap = document.getElementById('mediaPreviewVideoWrap');
	const img = document.getElementById('mediaPreviewImage');
	const video = document.getElementById('mediaPreviewVideo');
	video.pause();
	video.removeAttribute('src');
	if(Number(kind) === 2){
		imgWrap.classList.add('hidden');
		videoWrap.classList.remove('hidden');
		video.src = url;
		video.load();
	} else {
		videoWrap.classList.add('hidden');
		imgWrap.classList.remove('hidden');
		img.src = url;
	}
	modal.classList.add('show');
	if(Number(kind) === 2){
		video.play().catch(function(){});
	}
}

function fillModelOptions(models, current){
	const sel = document.getElementById('visionModel');
	sel.innerHTML = '';
	(models || []).forEach(m => {
		const opt = document.createElement('option');
		opt.value = m;
		opt.textContent = m;
		if(m === current) opt.selected = true;
		sel.appendChild(opt);
	});
}

async function loadConfig(){
	const data = await api('/ucg/admin/api/ai-config');
	fillModelOptions(data.allowedModels || [], data.visionModel);
	document.getElementById('maxImages').value = data.maxImagesPerRequest || 9;
	const meta = document.getElementById('meta');
	if(data.updatedAt){
		meta.textContent = '上次更新: ' + new Date(data.updatedAt * 1000).toLocaleString() + (data.updatedBy ? (' · ' + data.updatedBy) : '');
	} else {
		meta.textContent = '';
	}
	await loadQuotaDefault();
}

async function loadQuotaDefault(){
	const data = await api('/ucg/admin/api/ai-quota/default');
	document.getElementById('quotaPolishDefault').value = data.polishMonthlyLimit || 5;
	document.getElementById('quotaVoiceDefault').value = data.voiceAiMonthlyLimit || 5;
	const meta = document.getElementById('quotaDefaultMeta');
	meta.textContent = data.updatedAt ? ('默认更新: ' + new Date(data.updatedAt * 1000).toLocaleString()) : '';
}

async function loadQuotaUser(){
	const wxId = parseInt(document.getElementById('quotaWxId').value, 10);
	if(!wxId){ showMsg(document.getElementById('quotaMsg'), '请输入 wxId', false); return; }
	const data = await api('/ucg/admin/api/ai-quota/user?wxId='+wxId);
	document.getElementById('quotaPolishUser').value = data.polishMonthlyLimit != null ? data.polishMonthlyLimit : '';
	document.getElementById('quotaVoiceUser').value = data.voiceAiMonthlyLimit != null ? data.voiceAiMonthlyLimit : '';
	document.getElementById('quotaClearPolish').checked = false;
	document.getElementById('quotaClearVoice').checked = false;
	showMsg(document.getElementById('quotaMsg'), '已加载 wxId='+wxId, true);
}

function switchTab(which){
	const ai = which === 'ai';
	document.getElementById('tabAi').classList.toggle('active', ai);
	document.getElementById('tabPosts').classList.toggle('active', !ai);
	document.getElementById('panelAi').classList.toggle('hidden', !ai);
	document.getElementById('panelPosts').classList.toggle('hidden', ai);
	if(!ai) loadPostsList();
}

function updatePostsSelectionUI(){
	const n = selectedPostIds.size;
	document.getElementById('postsRejectBtn').disabled = n === 0;
	document.getElementById('postsSelectedHint').textContent = n ? ('已选 ' + n + ' 条') : '';
	const rejectable = postsRows.filter(r => Number(r.status) !== 3);
	const allSelected = rejectable.length > 0 && rejectable.every(r => selectedPostIds.has(r.id));
	document.getElementById('postsSelectPage').checked = allSelected;
}

function renderPostsTable(){
	const tbody = document.getElementById('postsTbody');
	tbody.innerHTML = '';
	postsRows.forEach(row => {
		const st = postStatusLabel(row.status);
		const rejectable = Number(row.status) !== 3;
		const tr = document.createElement('tr');
		const author = (row.author && row.author.nickname) ? row.author.nickname : ('wx:' + row.authorWxId);
		tr.innerHTML =
			'<td>' + (rejectable
				? '<input type="checkbox" class="post-row-cb" data-id="'+row.id+'"'+(selectedPostIds.has(row.id)?' checked':'')+' />'
				: '') + '</td>' +
			'<td>'+row.id+'</td>' +
			'<td>'+escapeHtml(author)+'</td>' +
			'<td class="content-cell">'+escapeHtml(truncate(row.content, 120))+'</td>' +
			'<td class="'+st.cls+'">'+st.text+'</td>' +
			'<td>'+formatUnix(row.updatedAt)+'</td>' +
			'<td class="media-cell"></td>';
		tr.querySelector('.media-cell').appendChild(renderMediaCell(row.media || []));
		tbody.appendChild(tr);
	});
	tbody.querySelectorAll('.post-row-cb').forEach(cb => {
		cb.addEventListener('change', () => {
			const id = Number(cb.getAttribute('data-id'));
			if(cb.checked) selectedPostIds.add(id); else selectedPostIds.delete(id);
			updatePostsSelectionUI();
		});
	});
	const totalPages = Math.max(1, Math.ceil(postsTotal / postsPageSize));
	document.getElementById('postsPagerInfo').textContent = '第 '+postsPage+' / '+totalPages+' 页，共 '+postsTotal+' 条';
	document.getElementById('postsPrevBtn').disabled = postsPage <= 1;
	document.getElementById('postsNextBtn').disabled = postsPage >= totalPages;
	updatePostsSelectionUI();
}

async function loadPostsList(){
	const status = document.getElementById('postStatusFilter').value;
	let url = '/ucg/admin/api/posts/list?page='+postsPage+'&pageSize='+postsPageSize;
	if(status !== '') url += '&status='+encodeURIComponent(status);
	const data = await api(url);
	postsRows = data.list || [];
	postsTotal = data.total || 0;
	postsPage = data.page || postsPage;
	renderPostsTable();
}

async function enterMain(){
	document.getElementById('mainCard').classList.remove('hidden');
	await loadConfig();
}

document.getElementById('saveBtn').addEventListener('click', async () => {
	const btn = document.getElementById('saveBtn');
	btn.disabled = true;
	try {
		const body = {
			visionModel: document.getElementById('visionModel').value,
			maxImagesPerRequest: parseInt(document.getElementById('maxImages').value, 10) || 9,
			updatedBy: 'ucg-admin.html'
		};
		await api('/ucg/admin/api/ai-config', {method:'PUT', body: JSON.stringify(body)});
		showMsg(document.getElementById('mainMsg'), 'AI 模型配置已保存', true);
		await loadConfig();
	} catch(e){
		showMsg(document.getElementById('mainMsg'), e.message || '保存失败', false);
	} finally {
		btn.disabled = false;
	}
});

document.getElementById('saveQuotaDefaultBtn').addEventListener('click', async () => {
	const btn = document.getElementById('saveQuotaDefaultBtn');
	btn.disabled = true;
	try {
		const body = {
			polishMonthlyLimit: parseInt(document.getElementById('quotaPolishDefault').value, 10) || 5,
			voiceAiMonthlyLimit: parseInt(document.getElementById('quotaVoiceDefault').value, 10) || 5
		};
		await api('/ucg/admin/api/ai-quota/default', {method:'PUT', body: JSON.stringify(body)});
		showMsg(document.getElementById('quotaMsg'), '全局额度默认已保存', true);
		await loadQuotaDefault();
	} catch(e){
		showMsg(document.getElementById('quotaMsg'), e.message || '保存失败', false);
	} finally {
		btn.disabled = false;
	}
});

document.getElementById('loadQuotaUserBtn').addEventListener('click', () => {
	loadQuotaUser().catch(e => showMsg(document.getElementById('quotaMsg'), e.message || '加载失败', false));
});

document.getElementById('saveQuotaUserBtn').addEventListener('click', async () => {
	const btn = document.getElementById('saveQuotaUserBtn');
	btn.disabled = true;
	try {
		const wxId = parseInt(document.getElementById('quotaWxId').value, 10);
		if(!wxId){ throw new Error('请输入 wxId'); }
		const body = { wxId, clearPolish: document.getElementById('quotaClearPolish').checked, clearVoiceAi: document.getElementById('quotaClearVoice').checked };
		const pVal = document.getElementById('quotaPolishUser').value.trim();
		const vVal = document.getElementById('quotaVoiceUser').value.trim();
		if(pVal && !body.clearPolish) body.polishMonthlyLimit = parseInt(pVal, 10);
		if(vVal && !body.clearVoiceAi) body.voiceAiMonthlyLimit = parseInt(vVal, 10);
		await api('/ucg/admin/api/ai-quota/user', {method:'PUT', body: JSON.stringify(body)});
		showMsg(document.getElementById('quotaMsg'), '单人额度已保存', true);
		await loadQuotaUser();
	} catch(e){
		showMsg(document.getElementById('quotaMsg'), e.message || '保存失败', false);
	} finally {
		btn.disabled = false;
	}
});

document.getElementById('tabAi').addEventListener('click', () => switchTab('ai'));
document.getElementById('tabPosts').addEventListener('click', () => switchTab('posts'));

document.getElementById('postStatusFilter').addEventListener('change', () => {
	postsPage = 1;
	selectedPostIds.clear();
	loadPostsList().catch(e => showMsg(document.getElementById('postsMsg'), e.message, false));
});

document.getElementById('postsRefreshBtn').addEventListener('click', () => {
	loadPostsList().then(() => showMsg(document.getElementById('postsMsg'), '已刷新', true))
		.catch(e => showMsg(document.getElementById('postsMsg'), e.message, false));
});

document.getElementById('postsPrevBtn').addEventListener('click', () => {
	if(postsPage > 1){ postsPage--; loadPostsList().catch(e => showMsg(document.getElementById('postsMsg'), e.message, false)); }
});

document.getElementById('postsNextBtn').addEventListener('click', () => {
	const totalPages = Math.max(1, Math.ceil(postsTotal / postsPageSize));
	if(postsPage < totalPages){ postsPage++; loadPostsList().catch(e => showMsg(document.getElementById('postsMsg'), e.message, false)); }
});

document.getElementById('postsSelectPage').addEventListener('change', (ev) => {
	const checked = ev.target.checked;
	postsRows.forEach(row => {
		if(Number(row.status) === 3) return;
		if(checked) selectedPostIds.add(row.id); else selectedPostIds.delete(row.id);
	});
	renderPostsTable();
});

document.getElementById('postsRejectBtn').addEventListener('click', async () => {
	const ids = Array.from(selectedPostIds);
	if(!ids.length) return;
	if(!confirm('确认批量驳回 '+ids.length+' 条动态？')) return;
	const btn = document.getElementById('postsRejectBtn');
	btn.disabled = true;
	try {
		const data = await api('/ucg/admin/api/posts/reject', {
			method:'POST',
			body: JSON.stringify({postIds: ids})
		});
		const msg = '驳回 '+((data.rejected||[]).length)+' 条，跳过 '+((data.skipped||[]).length)+' 条，失败 '+((data.failed||[]).length)+' 条';
		showMsg(document.getElementById('postsMsg'), msg, true);
		selectedPostIds.clear();
		await loadPostsList();
	} catch(e){
		showMsg(document.getElementById('postsMsg'), e.message || '驳回失败', false);
	} finally {
		updatePostsSelectionUI();
	}
});

document.getElementById('postsTbody').addEventListener('click', (ev) => {
	const btn = ev.target.closest('.media-thumb-btn');
	if(!btn) return;
	openMediaPreview(btn.dataset.mediaKind, btn.dataset.previewUrl);
});

document.getElementById('mediaPreviewClose').addEventListener('click', closeMediaPreview);
document.getElementById('mediaPreviewModal').addEventListener('click', (ev) => {
	if(ev.target.id === 'mediaPreviewModal') closeMediaPreview();
});
document.addEventListener('keydown', (ev) => {
	if(ev.key === 'Escape' && document.getElementById('mediaPreviewModal').classList.contains('show')){
		closeMediaPreview();
	}
});

if(AdminCommon.requireAdmin()){
	enterMain().catch(e => showMsg(document.getElementById('mainMsg'), e.message || '加载失败', false));
}
</script>
</div>
</body>
</html>
