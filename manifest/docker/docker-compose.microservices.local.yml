# 本地开发端口 overlay：与 microservices.yml 组合，宿主机映射与生产一致（9701/980x）。
#
# 示例：
#   docker compose --env-file manifest/docker/.env.local \
#     -f manifest/docker/docker-compose.microservices.yml \
#     -f manifest/docker/docker-compose.microservices.local.yml \
#     up -d --build
services:
  gateway:
    ports:
      - "9701:9701"

  gateway-app:
    ports:
      - "9702:9702"

  history-service:
    ports:
      - "9801:9801"

  voice-service:
    ports:
      - "9802:9802"

  device-service:
    ports:
      - "9803:9803"

  ucg-service:
    ports:
      - "9804:9804"

  sim-user-service:
    ports:
      - "9805:9805"

  notify-service:
    ports:
      - "9806:9806"
