version: "3.9"
# DEPRECATED — 测试 Redis 已改为 standalone（见 docker-compose.redis-standalone.test.yml）。
# 本文件保留仅供历史参考；runbook 与默认部署路径不再引用。
# 迁移：down -v 本 stack → up redis-standalone.test.yml → .env.test 设 GF_REDIS_DEFAULT_ADDRESS=redis-test:6379
#
# 原 6 节点测试 Cluster（17001–17006）— 勿在新环境使用。
# 项目名 go-ai-talk-redis-test。
# 宿主机映射 17001–17006 → 容器内 7001–7006；业务容器内仍用 redis-node-1:7001 等（test 网络 DNS）。
#
# 启动后初始化（在仓库根目录）：
#   docker compose -f manifest/docker/docker-compose.redis-cluster.test.yml exec -T redis-node-1 \
#     redis-cli --cluster create \
#     redis-node-1:7001 redis-node-2:7002 redis-node-3:7003 \
#     redis-node-4:7004 redis-node-5:7005 redis-node-6:7006 \
#     --cluster-replicas 1 --cluster-yes
# 验收：docker compose -f manifest/docker/docker-compose.redis-cluster.test.yml exec -T redis-node-1 \
#   redis-cli -p 7001 CLUSTER INFO  →  cluster_state:ok

name: go-ai-talk-redis-test

services:
  redis-node-1:
    image: redis:7.2-alpine
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --bind 0.0.0.0
    ports:
      - "17001:7001"
    volumes:
      - redis-test-node-1-data:/data
    networks: [go-ai-talk-test-net]

  redis-node-2:
    image: redis:7.2-alpine
    command: >
      redis-server
      --port 7002
      --cluster-enabled yes
