version: "3.9"
# 生产微服务资源上限（2C2G survival profile）；与 microservices + microservices.prod 合并使用。
# Redis / RabbitMQ  limits 见各自 compose（redis-cluster.yml、rabbitmq.yml）。

services:
  gateway:
    mem_limit: 192m
    cpus: "0.2"
  gateway-app:
    mem_limit: 192m
    cpus: "0.2"
  history-service:
    mem_limit: 128m
    cpus: "0.15"
  voice-service:
    mem_limit: 256m
    cpus: "0.3"
  device-service:
    mem_limit: 128m
    cpus: "0.15"
  ucg-service:
    mem_limit: 128m
    cpus: "0.15"
