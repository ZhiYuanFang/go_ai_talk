version: "3.9"

services:
  gateway:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.gateway-service
    image: go-ai-talk/gateway:local
    container_name: go-ai-talk-gateway
    environment:
      GF_GCFG_FILE: manifest/config/config.yaml
      HISTORY_API_ROUTE_MODE: proxy
      HISTORY_API_PROXY_URL: http://history-service:9801
      VOICE_API_ROUTE_MODE: proxy
      VOICE_API_PROXY_URL: http://voice-service:9802
      VOICE_API_PROXY_CANARY_PERCENT: "0"
      VOICE_WS_ROUTE_MODE: proxy
      VOICE_WS_PROXY_URL: http://voice-service:9802
      DEVICE_API_ROUTE_MODE: proxy
      DEVICE_API_PROXY_URL: http://device-service:9803
      DEVICE_API_PROXY_CANARY_PERCENT: "0"
      # 角色约束：gateway 不承载业务后台任务。
      MQ_CONSUMER_ENABLED: "false"
      OUTBOX_RELAY_ENABLED: "false"
      MQ_HTTP_API_BASE: "http://rabbitmq:15672/api"
      MQ_USER: "guest"
      MQ_PASSWORD: "guest"
    ports:
      - "9701:9701"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9701/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      history-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy
      device-service:
        condition: service_healthy
    networks: [go-ai-talk-net]

  gateway-app:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.gateway-app-service
    image: go-ai-talk/gateway-app:local
    container_name: go-ai-talk-gateway-app
    environment:
      GF_GCFG_FILE: manifest/config/config.gateway-app-server.yaml
      DEVICE_SERVICE_URL: "http://device-service:9803"
      HISTORY_API_ROUTE_MODE: proxy
      HISTORY_API_PROXY_URL: http://history-service:9801
      VOICE_API_ROUTE_MODE: proxy
      VOICE_API_PROXY_URL: http://voice-service:9802
      VOICE_WS_ROUTE_MODE: proxy
      VOICE_WS_PROXY_URL: http://voice-service:9802
      DEVICE_API_ROUTE_MODE: proxy
      DEVICE_API_PROXY_URL: http://device-service:9803
      MQ_CONSUMER_ENABLED: "false"
      OUTBOX_RELAY_ENABLED: "false"
      MQ_HTTP_API_BASE: "http://rabbitmq:15672/api"
      MQ_USER: "guest"
      MQ_PASSWORD: "guest"
      DEVICE_GATEWAY_INTERNAL_SECRET: "${DEVICE_GATEWAY_INTERNAL_SECRET:-gateway-internal-change-me}"
    ports:
      - "9702:9702"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9702/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      history-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy
      device-service:
        condition: service_healthy
    networks: [go-ai-talk-net]

  history-service:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.history-service
    image: go-ai-talk/history-service:local
    container_name: go-ai-talk-history-service
    # 使容器内可解析 host.docker.internal 为宿主机（连宿主机上 MySQL 时用，见 manifest/docker/.env.example）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_GCFG_FILE: manifest/config/config.history-service.yaml
      # 非空时覆盖默认库（cmd/history-service 读取 HISTORY_DB_LINK）。DSN 含多个「:」，必须整段加引号，否则 YAML 易截断，容器内变空仍走 yaml 占位 IP。
      HISTORY_DB_LINK: "${HISTORY_DB_LINK:-}"
      # history 容器内不得用 127.0.0.1 访问他域服务，须走 compose 服务名。
      VOICE_SERVICE_URL: "http://voice-service:9802"
      DEVICE_SERVICE_URL: "http://device-service:9803"
      WORKER_SERVICE_URL: "http://worker:9901"
      OUTBOX_RELAY_ENABLED: "true"
      # 与 runtimecheck 探活一致：启动前校验 RabbitMQ 管理 API 可达。
      MQ_HTTP_API_BASE: "http://rabbitmq:15672/api"
      MQ_USER: "guest"
      MQ_PASSWORD: "guest"
    ports:
      - "9801:9801"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9801/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [go-ai-talk-net]

  voice-service:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.voice-service
    image: go-ai-talk/voice-service:local
    container_name: go-ai-talk-voice-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_GCFG_FILE: manifest/config/config.voice-service.yaml
      VOICE_DB_LINK: "${VOICE_DB_LINK:-}"
      VOICE_SERVICE_ADDR: ":9802"
      VOICE_SERVICE_URL: "http://voice-service:9802"
      HISTORY_SERVICE_MODE: "remote"
      HISTORY_SERVICE_URL: "http://history-service:9801"
      HISTORY_SERVICE_CANARY_PERCENT: "0"
      HISTORY_SERVICE_REMOTE_FAILOVER_LOCAL: "true"
      DEVICE_PROFILE_SERVICE_MODE: "remote"
      DEVICE_SERVICE_URL: "http://device-service:9803"
      DEVICE_PROFILE_SERVICE_CANARY_PERCENT: "0"
      DEVICE_PROFILE_SERVICE_REMOTE_FAILOVER_LOCAL: "true"
      OUTBOX_RELAY_ENABLED: "false"
      MQ_HTTP_API_BASE: "http://rabbitmq:15672/api"
      MQ_USER: "guest"
      MQ_PASSWORD: "guest"
    ports:
      - "9802:9802"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9802/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [go-ai-talk-net]

  device-service:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.device-service
    image: go-ai-talk/device-service:local
    container_name: go-ai-talk-device-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_GCFG_FILE: manifest/config/config.device-service.yaml
      DEVICE_DB_LINK: "${DEVICE_DB_LINK:-}"
      DEVICE_SERVICE_ADDR: ":9803"
      VOICE_SERVICE_URL: "http://voice-service:9802"
      WORKER_SERVICE_URL: "http://worker:9901"
      OUTBOX_RELAY_ENABLED: "false"
      MQ_HTTP_API_BASE: "http://rabbitmq:15672/api"
      MQ_USER: "guest"
      MQ_PASSWORD: "guest"
      # 与 gateway-app 配置 gatewayApp.deviceInternalSecret 保持一致，供 /device/wx/api/internal/by-id 校验
      DEVICE_GATEWAY_INTERNAL_SECRET: "${DEVICE_GATEWAY_INTERNAL_SECRET:-gateway-internal-change-me}"
    ports:
      - "9803:9803"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9803/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [go-ai-talk-net]

  worker:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.worker-service
    image: go-ai-talk/worker:local
    container_name: go-ai-talk-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_GCFG_FILE: manifest/config/config.worker-service.yaml
      # 非空时由 cmd/worker-service 写入 GF_DATABASE_OUTBOX_LINK，指向仅含 domain_outbox 的库。
      WORKER_OUTBOX_DB_LINK: "${WORKER_OUTBOX_DB_LINK:-}"
      WORKER_HEALTH_ADDR: ":9901"
      HISTORY_SERVICE_URL: "http://history-service:9801"
      DEVICE_SERVICE_URL: "http://device-service:9803"
      # 角色约束：worker 独占异步消费与 outbox relay。
      MQ_CONSUMER_ENABLED: "true"
      OUTBOX_RELAY_ENABLED: "true"
      MQ_HTTP_API_BASE: "http://rabbitmq:15672/api"
      MQ_USER: "guest"
      MQ_PASSWORD: "guest"
    ports:
      - "9901:9901"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9901/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [go-ai-talk-net]

networks:
  go-ai-talk-net:
    external: true
    name: go-ai-talk-net
