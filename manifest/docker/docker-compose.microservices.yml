version: "3.9"
# 本文件为微服务拓扑基线，面向本机开发：含 build 段与 go-ai-talk/*:local 镜像。
#
# 生产 / 测试部署 MUST 叠加 overlay 并从镜像仓库 pull（禁止在服务器上 --build 作为常态发布）：
#   生产：… + microservices.prod.yml  →  project go-ai-talk-prod，宿主机端口 9701/980x
#   测试：… + microservices.test.yml  →  project go-ai-talk-test，宿主机端口 197xx
#   本地：… + microservices.local.yml →  宿主机端口 9701/980x（与 prod 相同，仅 image 为 :local）
# 基线不含 ports，避免 prod/test overlay 合并时端口叠加。
# 详见 manifest/docker/.env.prod.example、.env.test.example 与 docs/runbooks/release-deploy-and-run.md。
#
# 业务库：各服务 *_DB_LINK + MYSQL_TCP_HOST；Redis：GF_REDIS_DEFAULT_ADDRESS；JWT：GATEWAY_APP_JWT_SECRET（gateway-app + ucg）。
#
# 宿主机静态资源（Linux 根目录持久化，与 config 默认路径一致）：
#   gateway-app     → /apk/ai_talk       （gatewayApp.apkStorageDir）
# 首次部署建议在宿主机：sudo mkdir -p /apk/ai_talk && sudo chmod 755 /apk/ai_talk

# json-file 轮转：单文件 10MB、保留 3 个，约 30MB/容器上限（prod/test/local 共用基线）。
x-docker-logging: &docker-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.gateway-service
    image: go-ai-talk/gateway:local
    container_name: go-ai-talk-gateway
    environment:
      TZ: Asia/Shanghai
      GF_GCFG_FILE: manifest/config/config.yaml
      HISTORY_API_ROUTE_MODE: proxy
      HISTORY_API_PROXY_URL: http://history-service:9801
      VOICE_API_ROUTE_MODE: proxy
      VOICE_API_PROXY_URL: http://voice-service:9802
      VOICE_API_PROXY_CANARY_PERCENT: "0"
      VOICE_WS_ROUTE_MODE: proxy
      VOICE_WS_PROXY_URL: http://voice-service:9802
      DEVICE_API_ROUTE_MODE: proxy
      DEVICE_API_PROXY_URL: http://device-service:9803
      DEVICE_API_PROXY_CANARY_PERCENT: "0"
      # 角色约束：gateway 不承载业务后台任务。
      MQ_CONSUMER_ENABLED: "false"
      MQ_HTTP_API_BASE: "http://rabbitmq:15672/api"
      MQ_USER: "guest"
      MQ_PASSWORD: "guest"
      # 非空时覆盖 config yaml 的 redis cluster 地址（测试 standalone 用 redis-test:6379）
      GF_REDIS_DEFAULT_ADDRESS: "${GF_REDIS_DEFAULT_ADDRESS:-}"
      # admin/history 壳页 302 至 App 网关（见 installGatewayAdminRedirects）
      GATEWAY_APP_PUBLIC_BASE_URL: "${GATEWAY_APP_PUBLIC_BASE_URL:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9701/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      history-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy
      device-service:
        condition: service_healthy
    logging: *docker-logging

  gateway-app:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.gateway-app-service
    image: go-ai-talk/gateway-app:local
    container_name: go-ai-talk-gateway-app
    environment:
      TZ: Asia/Shanghai
      GF_GCFG_FILE: manifest/config/config.gateway-app-server.yaml
      # 非空时覆盖 ai_voice_app 连接（对应 GF_DATABASE_APP_LINK），与 HISTORY_DB_LINK 同理便于 compose 注入
      APP_DB_LINK: "${APP_DB_LINK:-}"
      MYSQL_TCP_HOST: "${MYSQL_TCP_HOST:-}"
      DEVICE_SERVICE_URL: "http://device-service:9803"
      HISTORY_API_ROUTE_MODE: proxy
      HISTORY_API_PROXY_URL: http://history-service:9801
      VOICE_API_ROUTE_MODE: proxy
      VOICE_API_PROXY_URL: http://voice-service:9802
      VOICE_WS_ROUTE_MODE: proxy
      VOICE_WS_PROXY_URL: http://voice-service:9802
      DEVICE_API_ROUTE_MODE: proxy
      DEVICE_API_PROXY_URL: http://device-service:9803
      UCG_SERVICE_BASE_URL: "http://ucg-service:9804"
      SIM_SERVICE_BASE_URL: "http://sim-user-service:9805"
      UCG_WS_ROUTE_MODE: proxy
      UCG_WS_PROXY_URL: http://ucg-service:9804
      MQ_CONSUMER_ENABLED: "false"
      MQ_HTTP_API_BASE: "http://rabbitmq:15672/api"
      MQ_USER: "guest"
      MQ_PASSWORD: "guest"
      DEVICE_GATEWAY_INTERNAL_SECRET: "${DEVICE_GATEWAY_INTERNAL_SECRET:-gateway-internal-change-me}"
      # 以下由 .env.prod / .env.test 注入；publicBaseUrl 用于 APK 下载绝对 URL；Admin JWT 与下游口令注入见 runbook
      GATEWAY_APP_PUBLIC_BASE_URL: "${GATEWAY_APP_PUBLIC_BASE_URL:-}"
      GATEWAY_APP_JWT_SECRET: "${GATEWAY_APP_JWT_SECRET:-}"
      GATEWAY_APP_CORS_ALLOWED_HOSTS: "${GATEWAY_APP_CORS_ALLOWED_HOSTS:-}"
      GATEWAY_APP_ADMIN_USERNAME: "${GATEWAY_APP_ADMIN_USERNAME:-admin}"
      GATEWAY_APP_ADMIN_PASSWORD: "${GATEWAY_APP_ADMIN_PASSWORD:-}"
      DEVICE_ADMIN_PASSWORD: "${DEVICE_ADMIN_PASSWORD:-}"
      UCG_ADMIN_PASSWORD: "${UCG_ADMIN_PASSWORD:-}"
      SIM_ADMIN_PASSWORD: "${SIM_ADMIN_PASSWORD:-}"
      GF_REDIS_DEFAULT_ADDRESS: "${GF_REDIS_DEFAULT_ADDRESS:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9702/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      history-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy
      device-service:
        condition: service_healthy
      ucg-service:
        condition: service_healthy
    # APK 落盘目录与 gatewayApp.apkStorageDir 默认 /apk/ai_talk/ 一致，映射到宿主机根目录便于备份
    # resource/public 挂载使 git pull 后官网静态页/内联脚本即时生效，无需重建镜像
    volumes:
      - /apk/ai_talk:/apk/ai_talk
      - ../../resource/public:/app/resource/public:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *docker-logging

  history-service:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.history-service
    image: go-ai-talk/history-service:local
    container_name: go-ai-talk-history-service
    # 使容器内可解析 host.docker.internal 为宿主机（连宿主机上 MySQL 时用，见 manifest/docker/.env.local）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      GF_GCFG_FILE: manifest/config/config.history-service.yaml
      # cmd/history-service 读取 HISTORY_DB_LINK；DSN 含多个「:」，compose 须整段加引号避免 YAML 截断。
      HISTORY_DB_LINK: "${HISTORY_DB_LINK:-}"
      MYSQL_TCP_HOST: "${MYSQL_TCP_HOST:-}"
      # history 经 HTTP 委派 voice-service 文本对话，须携带与 gateway-app 一致的内部 secret。
      DEVICE_GATEWAY_INTERNAL_SECRET: "${DEVICE_GATEWAY_INTERNAL_SECRET:-gateway-internal-change-me}"
      # history 容器内不得用 127.0.0.1 访问他域服务，须走 compose 服务名。
      VOICE_SERVICE_URL: "http://voice-service:9802"
      DEVICE_PROFILE_SERVICE_MODE: "remote"
      DEVICE_SERVICE_URL: "http://device-service:9803"
      # 与 runtimecheck 探活一致：启动前校验 RabbitMQ 管理 API 可达。
      MQ_HTTP_API_BASE: "http://rabbitmq:15672/api"
      MQ_USER: "guest"
      MQ_PASSWORD: "guest"
      GF_REDIS_DEFAULT_ADDRESS: "${GF_REDIS_DEFAULT_ADDRESS:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9801/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *docker-logging

  voice-service:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.voice-service
    image: go-ai-talk/voice-service:local
    container_name: go-ai-talk-voice-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      GF_GCFG_FILE: manifest/config/config.voice-service.yaml
      GATEWAY_APP_JWT_SECRET: "${GATEWAY_APP_JWT_SECRET:-}"
      # internal 路由（ai-quota / text/chat）校验 X-Device-Gateway-Internal-Secret，须与 history/gateway-app 一致。
      DEVICE_GATEWAY_INTERNAL_SECRET: "${DEVICE_GATEWAY_INTERNAL_SECRET:-gateway-internal-change-me}"
      VOICE_DB_LINK: "${VOICE_DB_LINK:-}"
      MYSQL_TCP_HOST: "${MYSQL_TCP_HOST:-}"
      VOICE_SERVICE_ADDR: ":9802"
      VOICE_SERVICE_URL: "http://voice-service:9802"
      HISTORY_SERVICE_MODE: "remote"
      HISTORY_SERVICE_URL: "http://history-service:9801"
      HISTORY_SERVICE_CANARY_PERCENT: "0"
      HISTORY_SERVICE_REMOTE_FAILOVER_LOCAL: "true"
      DEVICE_PROFILE_SERVICE_MODE: "remote"
      DEVICE_SERVICE_URL: "http://device-service:9803"
      DEVICE_PROFILE_SERVICE_CANARY_PERCENT: "0"
      DEVICE_PROFILE_SERVICE_REMOTE_FAILOVER_LOCAL: "true"
      MQ_HTTP_API_BASE: "http://rabbitmq:15672/api"
      MQ_USER: "guest"
      MQ_PASSWORD: "guest"
      GF_REDIS_DEFAULT_ADDRESS: "${GF_REDIS_DEFAULT_ADDRESS:-}"
      GLM_API_KEY: "${GLM_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      VOICE_LLM_VOICE_UNDERSTANDING_PROVIDER: "${VOICE_LLM_VOICE_UNDERSTANDING_PROVIDER:-}"
      VOICE_LLM_VOICE_UNDERSTANDING_MODEL: "${VOICE_LLM_VOICE_UNDERSTANDING_MODEL:-}"
      VOICE_LLM_CLINIC_PROVIDER: "${VOICE_LLM_CLINIC_PROVIDER:-}"
      VOICE_LLM_CLINIC_MODEL: "${VOICE_LLM_CLINIC_MODEL:-}"
      VOICE_ADMIN_PASSWORD: "${VOICE_ADMIN_PASSWORD:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9802/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *docker-logging

  device-service:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.device-service
    image: go-ai-talk/device-service:local
    container_name: go-ai-talk-device-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      GF_GCFG_FILE: manifest/config/config.device-service.yaml
      DEVICE_DB_LINK: "${DEVICE_DB_LINK:-}"
      MYSQL_TCP_HOST: "${MYSQL_TCP_HOST:-}"
      DEVICE_SERVICE_ADDR: ":9803"
      VOICE_SERVICE_URL: "http://voice-service:9802"
      MQ_HTTP_API_BASE: "http://rabbitmq:15672/api"
      MQ_USER: "guest"
      MQ_PASSWORD: "guest"
      # 与 gateway-app 配置 gatewayApp.deviceInternalSecret 保持一致，供 GET /device/app/api/user/internal/by-id 校验
      DEVICE_GATEWAY_INTERNAL_SECRET: "${DEVICE_GATEWAY_INTERNAL_SECRET:-gateway-internal-change-me}"
      DEVICE_ADMIN_PASSWORD: "${DEVICE_ADMIN_PASSWORD:-}"
      UCG_SERVICE_BASE_URL: "http://ucg-service:9804"
      GF_REDIS_DEFAULT_ADDRESS: "${GF_REDIS_DEFAULT_ADDRESS:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9803/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *docker-logging

  ucg-service:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.ucg-service
    image: go-ai-talk/ucg-service:local
    container_name: go-ai-talk-ucg-service
    volumes:
      - ./env/apns:/app/apns:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      GF_GCFG_FILE: manifest/config/config.ucg-service.yaml
      UCG_DB_LINK: "${UCG_DB_LINK:-}"
      MYSQL_TCP_HOST: "${MYSQL_TCP_HOST:-}"
      UCG_SERVICE_ADDR: ":9804"
      DEVICE_SERVICE_URL: "http://device-service:9803"
      DEVICE_GATEWAY_INTERNAL_SECRET: "${DEVICE_GATEWAY_INTERNAL_SECRET:-gateway-internal-change-me}"
      GATEWAY_APP_JWT_SECRET: "${GATEWAY_APP_JWT_SECRET:-}"
      UCG_OSS_ACCESS_KEY_ID: "${UCG_OSS_ACCESS_KEY_ID:-}"
      UCG_OSS_ACCESS_KEY_SECRET: "${UCG_OSS_ACCESS_KEY_SECRET:-}"
      UCG_DASHSCOPE_API_KEY: "${UCG_DASHSCOPE_API_KEY:-}"
      GLM_API_KEY: "${GLM_API_KEY:-}"
      UCG_AI_PROVIDER: "${UCG_AI_PROVIDER:-}"
      UCG_AI_VISION_MODEL: "${UCG_AI_VISION_MODEL:-}"
      UCG_ADMIN_PASSWORD: "${UCG_ADMIN_PASSWORD:-}"
      UCG_APNS_KEY_ID: "${UCG_APNS_KEY_ID:-}"
      UCG_APNS_TEAM_ID: "${UCG_APNS_TEAM_ID:-}"
      UCG_APNS_BUNDLE_ID: "${UCG_APNS_BUNDLE_ID:-}"
      UCG_APNS_KEY_PATH: "${UCG_APNS_KEY_PATH:-}"
      UCG_APNS_PRODUCTION: "${UCG_APNS_PRODUCTION:-}"
      UCG_HMS_APP_ID: "${UCG_HMS_APP_ID:-}"
      UCG_HMS_APP_SECRET: "${UCG_HMS_APP_SECRET:-}"
      UCG_MIPUSH_APP_ID: "${UCG_MIPUSH_APP_ID:-}"
      UCG_MIPUSH_APP_KEY: "${UCG_MIPUSH_APP_KEY:-}"
      UCG_MIPUSH_APP_SECRET: "${UCG_MIPUSH_APP_SECRET:-}"
      MQ_HTTP_API_BASE: "http://rabbitmq:15672/api"
      MQ_USER: "guest"
      MQ_PASSWORD: "guest"
      # 审核 Publisher 用 HTTP 15672；Consumer 用 AMQP 5672 push + manual ack
      RABBITMQ_AMQP_URL: "amqp://guest:guest@rabbitmq:5672/"
      UCG_AUDIT_MQ_CONSUMER_ENABLED: "true"
      UCG_AUDIT_MQ_PREFETCH: "5"
      GF_REDIS_DEFAULT_ADDRESS: "${GF_REDIS_DEFAULT_ADDRESS:-}"
      # 可选：覆盖 yaml 中 ucg.ip2regionXdbPath；默认镜像内 /app/resource/ip2region/ip2region_v4.xdb
      IP2REGION_XDB_PATH: "${IP2REGION_XDB_PATH:-/app/resource/ip2region/ip2region_v4.xdb}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9804/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *docker-logging

  sim-user-service:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.sim-user-service
    image: go-ai-talk/sim-user-service:local
    container_name: go-ai-talk-sim-user-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      GF_GCFG_FILE: manifest/config/config.sim-user-service.yaml
      SIM_DB_LINK: "${SIM_DB_LINK:-${APP_DB_LINK:-}}"
      MYSQL_TCP_HOST: "${MYSQL_TCP_HOST:-}"
      SIM_USER_SERVICE_ADDR: ":9805"
      SIM_USER_SERVICE_ENABLED: "${SIM_USER_SERVICE_ENABLED:-false}"
      # sim 任务开关与周期（--env-file 注入；未设时与 runtime.go 默认一致）
      SIM_TASK_REGISTER_ENABLED: "${SIM_TASK_REGISTER_ENABLED:-true}"
      SIM_TASK_COMMENT_ENABLED: "${SIM_TASK_COMMENT_ENABLED:-true}"
      SIM_TASK_POST_IMAGE_ENABLED: "${SIM_TASK_POST_IMAGE_ENABLED:-true}"
      SIM_TASK_POST_VIDEO_ENABLED: "${SIM_TASK_POST_VIDEO_ENABLED:-true}"
      SIM_TASK_CHAT_ENABLED: "${SIM_TASK_CHAT_ENABLED:-true}"
      SIM_TASK_FOLLOW_ENABLED: "${SIM_TASK_FOLLOW_ENABLED:-true}"
      SIM_VIDEO_POLL_ENABLED: "${SIM_VIDEO_POLL_ENABLED:-true}"
      SIM_INTERVAL_REGISTER: "${SIM_INTERVAL_REGISTER:-24h}"
      SIM_INTERVAL_COMMENT: "${SIM_INTERVAL_COMMENT:-6h}"
      SIM_INTERVAL_POST_IMAGE: "${SIM_INTERVAL_POST_IMAGE:-3h30m}"
      SIM_INTERVAL_POST_VIDEO: "${SIM_INTERVAL_POST_VIDEO:-6h30m}"
      SIM_INTERVAL_CHAT: "${SIM_INTERVAL_CHAT:-1h}"
      SIM_INTERVAL_FOLLOW: "${SIM_INTERVAL_FOLLOW:-7h}"
      SIM_INTERVAL_VIDEO_POLL_IDLE: "${SIM_INTERVAL_VIDEO_POLL_IDLE:-10m}"
      SIM_INTERVAL_VIDEO_POLL_ACTIVE: "${SIM_INTERVAL_VIDEO_POLL_ACTIVE:-2m}"
      SIM_EPHEMERAL_CHAT_LOOP: "${SIM_EPHEMERAL_CHAT_LOOP:-5m}"
      SIM_EPHEMERAL_CHAT_WINDOW: "${SIM_EPHEMERAL_CHAT_WINDOW:-15m}"
      SIM_STARTUP_STAGGER_MAX: "${SIM_STARTUP_STAGGER_MAX:-30m}"
      SIM_UCG_RATE_LIMIT_RPS: "${SIM_UCG_RATE_LIMIT_RPS:-2}"
      SIM_UCG_RATE_LIMIT_BURST: "${SIM_UCG_RATE_LIMIT_BURST:-4}"
      GATEWAY_APP_URL: "http://gateway-app:9702"
      DEVICE_SERVICE_URL: "http://device-service:9803"
      UCG_SERVICE_URL: "http://ucg-service:9804"
      DEVICE_GATEWAY_INTERNAL_SECRET: "${DEVICE_GATEWAY_INTERNAL_SECRET:-gateway-internal-change-me}"
      GLM_API_KEY: "${GLM_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      UCG_DASHSCOPE_API_KEY: "${UCG_DASHSCOPE_API_KEY:-}"
      SIM_LLM_SIMTEXT_PROVIDER: "${SIM_LLM_SIMTEXT_PROVIDER:-}"
      SIM_LLM_SIMTEXT_MODEL: "${SIM_LLM_SIMTEXT_MODEL:-}"
      SIM_LLM_SIMVISION_PROVIDER: "${SIM_LLM_SIMVISION_PROVIDER:-}"
      SIM_LLM_SIMVISION_MODEL: "${SIM_LLM_SIMVISION_MODEL:-}"
      SIM_LLM_SIMIMAGEGEN_PROVIDER: "${SIM_LLM_SIMIMAGEGEN_PROVIDER:-}"
      SIM_LLM_SIMIMAGEGEN_MODEL: "${SIM_LLM_SIMIMAGEGEN_MODEL:-}"
      SIM_LLM_SIMVIDEOGEN_PROVIDER: "${SIM_LLM_SIMVIDEOGEN_PROVIDER:-}"
      SIM_LLM_SIMVIDEOGEN_MODEL: "${SIM_LLM_SIMVIDEOGEN_MODEL:-}"
      SIM_ADMIN_PASSWORD: "${SIM_ADMIN_PASSWORD:-}"
      GF_REDIS_DEFAULT_ADDRESS: "${GF_REDIS_DEFAULT_ADDRESS:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9805/api.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *docker-logging
