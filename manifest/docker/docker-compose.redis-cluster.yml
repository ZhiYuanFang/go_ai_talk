version: "3.9"

services:
  redis-node-1:
    image: redis:7.2-alpine
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --bind 0.0.0.0
    ports:
      - "7001:7001"
    volumes:
      - redis-node-1-data:/data
    networks: [redis-cluster-net]

  redis-node-2:
    image: redis:7.2-alpine
    command: >
