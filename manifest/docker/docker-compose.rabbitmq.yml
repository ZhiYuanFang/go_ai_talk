version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: go-ai-talk-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # 与微服务/Redis 共用 go-ai-talk-net，容器名 rabbitmq 可被各服务解析。
    networks:
      - go-ai-talk-net

volumes:
  rabbitmq-data:

networks:
  go-ai-talk-net:
    external: true
    name: go-ai-talk-net
