# 生产 overlay：与基线 docker-compose.microservices.yml 组合使用。
# 项目名 go-ai-talk-prod（与测试栈 go-ai-talk-test 隔离，同机双栈 MUST 各自独立 project）。
# 镜像来自 registry；启动前 pull，且 MUST 使用 --no-build。
#
# 本文件只改「生产部署项」：镜像、ports、networks。
# 不写 environment：业务环境变量全部由基线 + --env-file .env.prod 注入。
# 宿主机端口在此定义（基线无 ports，避免与 test overlay 合并叠加）。

name: go-ai-talk-prod

services:
  gateway:
    image: ${REGISTRY}/gateway:${IMAGE_TAG}
    ports:
      - "9701:9701"
    networks: [go-ai-talk-net]

  gateway-app:
    image: ${REGISTRY}/gateway-app:${IMAGE_TAG}
    ports:
      - "9702:9702"
    networks: [go-ai-talk-net]

  history-service:
    image: ${REGISTRY}/history-service:${IMAGE_TAG}
    ports:
      - "9801:9801"
    networks: [go-ai-talk-net]

  voice-service:
    image: ${REGISTRY}/voice-service:${IMAGE_TAG}
    ports:
      - "9802:9802"
    networks: [go-ai-talk-net]

  device-service:
    image: ${REGISTRY}/device-service:${IMAGE_TAG}
    ports:
      - "9803:9803"
    networks: [go-ai-talk-net]

  ucg-service:
    image: ${REGISTRY}/ucg-service:${IMAGE_TAG}
    ports:
      - "9804:9804"
    networks: [go-ai-talk-net]

  sim-user-service:
    image: ${REGISTRY}/sim-user-service:${IMAGE_TAG}
    ports:
      - "9805:9805"
    networks: [go-ai-talk-net]

  notify-service:
    image: ${REGISTRY}/notify-service:${IMAGE_TAG}
    ports:
      - "9806:9806"
    networks: [go-ai-talk-net]

  # mcp-service 不监听 HTTP 端口（WebSocket 客户端），无需 ports 映射；
  # 仅需接入 go-ai-talk-net 以访问 voice-service。
  mcp-service:
    image: ${REGISTRY}/mcp-service:${IMAGE_TAG}
    networks: [go-ai-talk-net]

networks:
  go-ai-talk-net:
    external: true
    name: go-ai-talk-net