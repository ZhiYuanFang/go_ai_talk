# 容器/K8s 部署 MUST 设置 VOICE_SERVICE_URL（如 http://voice-service:9802），供管理后台「问答库」列表 HTTP 委派到 voice-service；
# 事件/动作/画像写路径同步刷新 Redis 缓存（见 device/admin.go refreshEventOptionsCacheAfterMutate / setUserProfile）。
# 事件 logo 上传 MUST 设置 UCG_SERVICE_BASE_URL（如 http://ucg-service:9804）与 DEVICE_GATEWAY_INTERNAL_SECRET。
# MySQL：DEVICE_DB_LINK + MYSQL_TCP_HOST；Redis：GF_REDIS_DEFAULT_ADDRESS。

server:
  address: ":9803"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

# 事件 logo CDN 根地址（与 ucg.oss.cdnBaseUrl 一致；可用 UCG_OSS_CDN_BASE_URL 覆盖）。
device:
  eventLogoCdnBaseUrl: "https://resorce.cuplay.top"
  ucgServiceUrl: ""

wechat:
  platforms:
    ios:
      appId: "wxe713de83c921f341"
      appSecret: "74dd30876697b02bea9fbabd13bfb6fc"
    android:
      appId: "wxe713de83c921f341"
      appSecret: "74dd30876697b02bea9fbabd13bfb6fc"
    web:
      appId: "wxe713de83c921f341"
      appSecret: "74dd30876697b02bea9fbabd13bfb6fc"
    miniprogram:
      appId: ""       # wx_ai_talk 小程序 AppId（部署时填写）
      appSecret: ""   # wx_ai_talk 小程序 AppSecret（部署时填写）

# Apple Sign in with Apple：identityToken JWT aud 校验用 iOS Bundle ID（须与客户端一致）。
