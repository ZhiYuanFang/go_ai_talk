# 容器/K8s 部署 MUST 设置 VOICE_SERVICE_URL（如 http://voice-service:9802），供管理后台「问答库」列表 HTTP 委派到 voice-service；
# OUTBOX 开启时 MUST 设置 WORKER_SERVICE_URL（如 http://worker:9901），经 HTTP 将 domain_outbox 入队到 worker 专用库 ai_voice_worker（见 enqueueDomainOutboxToHistoryRelay）。
# MySQL：DEVICE_DB_LINK + MYSQL_TCP_HOST；Redis：GF_REDIS_DEFAULT_ADDRESS。

server:
  address: ":9803"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

# 微信开放平台 OAuth（sns/oauth2/access_token）：platform 与客户端 POST /device/app/api/user/login 的 platform 一致。
# ios/android 须配置为同一移动应用 appId/secret；web 为网站应用独立凭据。生产务必覆盖 appSecret，勿提交真实密钥。
# 事件 logo 落盘目录（库内 logo 字段仅存 /ai_talk_images/... 路径，不含域名）。
device:
  eventImageStorageDir: "/ai_talk_images/"
  eventImageMaxBytes: 2097152

wechat:
  platforms:
    ios:
      appId: "wxe713de83c921f341"
      appSecret: "74dd30876697b02bea9fbabd13bfb6fc"
    android:
      appId: "wxe713de83c921f341"
      appSecret: "74dd30876697b02bea9fbabd13bfb6fc"
    web:
      appId: "wxe713de83c921f341"
      appSecret: "74dd30876697b02bea9fbabd13bfb6fc"

# Apple Sign in with Apple：identityToken JWT aud 校验用 iOS Bundle ID（须与客户端一致）。
apple:
  ios:
    bundleId: "com.fzy.pangbao"
