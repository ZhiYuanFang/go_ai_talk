# ucg-service：社交 UGC 域（ai_voice_ucg）。Docker/K8s 部署时设置 DEVICE_SERVICE_URL 与 DEVICE_GATEWAY_INTERNAL_SECRET。
# 评论列表 GET 单次全量返回（非分页）；ucg.comments.listMax 为硬上限，超出时 truncated=true，0 表示不限制（仅内测慎用）。
# 阿里云凭证 MUST 经环境变量注入（yaml 留空）：UCG_OSS_ACCESS_KEY_ID、UCG_OSS_ACCESS_KEY_SECRET、UCG_DASHSCOPE_API_KEY。
# Green 内容审核复用 OSS AccessKey（ucg.green.accessKey* 留空即可）；见 manifest/docker/.env.example 与 runbook。
# MySQL：UCG_DB_LINK + MYSQL_TCP_HOST；JWT 校验用 GATEWAY_APP_JWT_SECRET（与 gateway-app 同值）。
server:
  address: ":9804"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  # 视频上传上限 20MB；须大于 Flutter maxUcgVideoBytes，默认 GoFrame 8MB 会导致 Web 代理上传失败。
  clientMaxBodySize: "25MB"

logger:
  level: "all"
  stdout: true

ucg:
  comments:
    listMax: 500
  deviceServiceUrl: ""
  deviceInternalSecret: ""
  # ip2region IPv4 离线库路径；Docker 内默认 /app/resource/ip2region/ip2region_v4.xdb，可用 IP2REGION_XDB_PATH 覆盖。
  ip2regionXdbPath: "/app/resource/ip2region/ip2region_v4.xdb"
  oss:
    bucket: "pang-bao"
    region: "cn-beijing"
    endpoint: "oss-cn-beijing.aliyuncs.com"
    accessKeyId: ""
    accessKeySecret: ""
    objectKeyPrefix: "social/"
    # 展示 URL：CDN 域名（API cdnUrl / 客户端 objectKeyToCdn 均基于此）
    cdnBaseUrl: "https://resorce.cuplay.top"
  green:
    enabled: true
    endpoint: "green-cip.cn-beijing.aliyuncs.com"
    region: "cn-beijing"
    accessKeyId: ""
    accessKeySecret: ""
    auditIntervalSeconds: 5
  # 推荐算法参数（score = wNew*exp(-age/tau) + wLike*log(1+likes) + wComment*log(1+comments)，见 design.md）
  recommend:
    wNew: 1.0          # 新鲜度权重
    tauHours: 72       # 时间衰减常数（小时）
    wLike: 0.3         # 点赞对数项权重
    wComment: 0.5      # 评论对数项权重
    refreshIntervalSeconds: 300  # 后台重算间隔（秒）
  # AI 润笔（DashScope Qwen vision）：DashScope key 经 env UCG_DASHSCOPE_API_KEY 注入；Admin 口令见 ucg.admin.password。
  # 注意：此为阿里云 DashScope API Key，非 DeepSeek/SiliconFlow 文本或 VL2 key。
  ai:
    # DashScope API Key；留空则润笔接口返回未配置（生产 MUST 用 env 注入）
    dashscope_api_key: ""
    vision_endpoint: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
    default_vision_model: "qwen3-vl-plus"
    default_max_images_per_request: 9
    timeout_seconds: 60
  admin:
    # 管理口令：生产 MUST 用 env UCG_ADMIN_PASSWORD 注入；yaml 留空。gateway-app 校验 Admin JWT 后注入 X-Admin-Password。
    password: ""
