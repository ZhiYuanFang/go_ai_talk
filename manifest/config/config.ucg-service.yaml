# ucg-service：社交 UGC 域（ai_voice_ucg）。Docker/K8s 部署时设置 DEVICE_SERVICE_URL 与 DEVICE_GATEWAY_INTERNAL_SECRET。
# OSS 凭证可按环境变量 UCG_OSS_ACCESS_KEY_ID / UCG_OSS_ACCESS_KEY_SECRET 覆盖（生产建议 env 注入）。
server:
  address: ":9804"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

database:
  default:
    # 运行时请通过环境变量 UCG_DB_LINK 覆盖（cmd 启动时 gdb.SetConfigGroup 覆盖 yaml）
    link: "mysql:root:Fang930927@tcp(120.55.50.105:3306)/ai_voice_ucg"
    debug: false

redis:
  default:
    address: "redis-node-1:7001,redis-node-2:7002,redis-node-3:7003"
    db: 0

ucg:
  deviceServiceUrl: ""
  deviceInternalSecret: ""
  oss:
    bucket: "pang-bao"
    region: "cn-beijing"
    endpoint: "oss-cn-beijing.aliyuncs.com"
    accessKeyId: "LTAI5t6tomJZp4im2H32FSMT"
    accessKeySecret: "LVCECT4exrGkkhI85HmyD4P2e6wJZW"
    objectKeyPrefix: "social/"
    cdnBaseUrl: "https://resorce.cuplay.top/"
  green:
    enabled: false
    endpoint: "green-cip.cn-beijing.aliyuncs.com"
    region: "cn-beijing"
    accessKeyId: ""
    accessKeySecret: ""
    auditIntervalSeconds: 5
  # 与 gateway-app jwtSecret 保持一致，供 WS 首帧 auth 校验
  jwtSecret: "gateway-app-change-me-in-production"
  # 推荐算法参数（score = wNew*exp(-age/tau) + wLike*log(1+likes) + wComment*log(1+comments)，见 design.md）
  recommend:
    wNew: 1.0          # 新鲜度权重
    tauHours: 72       # 时间衰减常数（小时）
    wLike: 0.3         # 点赞对数项权重
    wComment: 0.5      # 评论对数项权重
    refreshIntervalSeconds: 300  # 后台重算间隔（秒）
