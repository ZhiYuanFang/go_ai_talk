server:
  address:     ":9701"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level : "all"
  stdout: true


database:
  default:
    link:   "mysql:root:Fang930927@tcp(120.55.50.105:3306)/ai_voice"
    debug:  true

voiceChat:
  debugLog: true
  audio:
    sampleRate: 16000
    bits: 16
    channels: 1
    maxDurationSec: 30
  session:
    maxRounds: 10
    ttlSeconds: 1800
    maxDeviceSessions: 1000
    cleanupIntervalSeconds: 60
  stt:
    provider: "baidu"
    endpoint: "https://vop.baidu.com/server_api" # 语音识别标准版接口
    streamEnabled: true
    streamEndpoint: "wss://vop.baidu.com/realtime_asr" # 语音识别流式接口
    realtimeDebounceMs: 1200 # 边收边翻译触发去抖时间（毫秒）
    realtimeMinRunes: 4 # 边收边翻译最小文本长度（字符）
    sn: "" # 建议留空，服务端会为每次会话动态生成唯一sn，避免重复sn导致异常
    tokenEndpoint: "https://aip.baidubce.com/oauth/2.0/token"
    apiKey: "iZZApLGcYBhyR5Djqtp7Kc1m"
    apiSecret: "F8uXBqwGwUkpy3tYp6eMEBqX2s1R5wsm"
    model: ""
    cuid: "gofirst-device"
    devPid: 1537
    format: "pcm"
    timeoutSeconds: 20
    maxConcurrency: 50
  deepseek:
    endpoint: "https://api.deepseek.com/v1/chat/completions"
    apiKey: "sk-e5685321acda4a3f8cb15abc5345c130"  
    model: "deepseek-chat"
    systemPrompt: ""
    stream: true
    minTextLength: 2
    timeoutSeconds: 20
    maxConcurrency: 100
  tts:
    provider: "baidu"
    endpoint: "https://tsn.baidu.com/text2audio" # 语音合成短文本接口
    tokenEndpoint: "https://aip.baidubce.com/oauth/2.0/token"
    apiKey: "iZZApLGcYBhyR5Djqtp7Kc1m"
    apiSecret: "F8uXBqwGwUkpy3tYp6eMEBqX2s1R5wsm"
    model: ""
    voice: "0"  # 基础音库：度小宇=1，度小美=0，度逍遥（基础）=3，度丫丫=4
    language: "zh"
    speed: "5" # 语速 1~15 
    pitch: "5" # 音调 1~15
    volume: "15" # 音量 1~15
    aue: "6" # 音频格式 3：mp3，4：pcm-16k，5：pcm-8k，6：wav
    cuid: "gofirst-device"
    timeoutSeconds: 100
