# gateway-app-server：App 专用入口（JWT、登录/刷新、版本库、历史 WS、下游代理）。
# 部署时 MUST 设置 DEVICE_SERVICE_URL、HISTORY_SERVICE_URL 指向可达下游；JWT 与内部密钥禁止提交默认值到生产。
#
# 【新建实例 / 新环境必检 — 数据库】本进程会读 ai_voice_app.version（版本检查），必须能连上 ai_voice_app：
#   - 二选一即可：① 本文件 database.app.link 改为该环境真实 DSN；② 或部署时设置环境变量 APP_DB_LINK
#    （cmd/gateway-app-server 会写入 GF_DATABASE_APP_LINK，与 Compose/K8s 的 manifest/docker/.env.example 中 APP_DB_LINK 对齐）。
#   若既不改 yaml 又不设 APP_DB_LINK，易沿用占位 IP，新实例上版本接口会连库失败。
# 配置组为 database.app（非 default）；语义上同 history-service 用 HISTORY_DB_LINK 覆盖 default，此处覆盖的是 app 分组。

server:
  address: ":9702"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

redis:
  default:
    address: "redis-node-1:7001,redis-node-2:7002,redis-node-3:7003"
    db: 0

database:
  app:
    # 新环境请改为可达 DSN，或改用环境变量 APP_DB_LINK 覆盖（勿依赖占位地址）
    link: "mysql:root:Fang930927@tcp(120.55.50.105:3306)/ai_voice_app"
    debug: false

gatewayApp:
  # HS256 签名密钥（生产务必覆盖）
  jwtSecret: "gateway-app-change-me-in-production"
  accessTtlSeconds: 1800
  refreshTtlSeconds: 604800
  # 调用 device 内部 HTTP（如 internal/device-no-by-wx-id）时携带，须与 device 环境 DEVICE_GATEWAY_INTERNAL_SECRET 一致
  deviceInternalSecret: "gateway-internal-change-me"
  # 以下缓存项曾为 id→unionid 热路径保留；当前 Bearer 仅从 JWT 注入 Wx-Id/Device-No，可删除整段或保留作占位兼容
  wxIdUnionCacheSeconds: 120
  wxIdCodeCacheSeconds: 120
  # —— App 版本管理页（上传 APK、写 download_url）——
  # 对外可访问的 gateway-app 根 URL（无末尾斜杠），用于拼接 APK 绝对下载地址；生产请用环境变量 GATEWAY_APP_PUBLIC_BASE_URL 覆盖。
  publicBaseUrl: ""
  # APK 存储目录（Linux 云主机默认 /apk/ai_talk/）；可用 GATEWAY_APP_APK_STORAGE_DIR 覆盖。
  apkStorageDir: "/apk/ai_talk/"
  # 单包大小上限（字节），默认 200MB；可用 GATEWAY_APP_APK_MAX_BYTES 覆盖。
  apkMaxBytes: 209715200
  versionAdmin:
    # 管理员口令：务必使用环境变量 GATEWAY_APP_VERSION_ADMIN_PASSWORD 注入，勿将生产口令写入提交到 git 的 yaml。
    password: ""
    # 管理会话 TTL（秒），默认 8 小时。
    sessionTtlSeconds: 28800
    # HTTPS 部署时建议 true，或用环境变量 GATEWAY_APP_VERSION_ADMIN_COOKIE_SECURE=1；本地 http 可 false。
    cookieSecure: false
