# voice-service 仅连接本域库（qa/suggest）；访问 user/event/action 等 MUST 经 HTTP 访问 device-service。
# 运行时请设置：DEVICE_SERVICE_URL（默认可回退 http://127.0.0.1:9803）、DEVICE_PROFILE_SERVICE_MODE=remote（推荐）。
# MySQL：VOICE_DB_LINK + MYSQL_TCP_HOST；Redis：GF_REDIS_DEFAULT_ADDRESS。

server:
  address: ":9802"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

# voiceChat 已迁至 manifest/config/voice-chat.shared.yaml（与 history-service 共用，避免重复维护）。

# 胖宝诊疗独立配置（endpoint/apiKey 复用 voice-chat.shared.yaml deepseek 段）。
# 业务说明：不再配置 sessionTtl/summaryTtl——Go 不缓存对话与喂养摘要；多轮由 Python 负责。
aiClinic:
  model: deepseek-v4-pro
  llmTimeoutSeconds: 120
  thinkingEnabled: true
  reasoningEffort: high
  rateLimitWindowSeconds: 60
  rateLimitMaxRequests: 10

# voice admin 口令（生产由 VOICE_ADMIN_PASSWORD 环境变量覆盖）
voice:
  admin:
    password: ""

# OpenClaw Gateway（Intent/Clinic/Care 编排上游；可用环境变量覆盖）
openclaw:
  gatewayUrl: "${OPENCLAW_GATEWAY_URL}"
  gatewayToken: "${OPENCLAW_GATEWAY_TOKEN}"
  apiToken: "${PANGBAO_API_TOKEN}"
