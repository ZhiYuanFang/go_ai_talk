# voice-service 仅连接本域库（qa/suggest）；访问 user/event/action 等 MUST 经 HTTP 访问 device-service。
# 运行时请设置：DEVICE_SERVICE_URL（默认可回退 http://127.0.0.1:9803）、DEVICE_PROFILE_SERVICE_MODE=remote（推荐）。

server:
  address: ":9802"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

database:
  default:
    # 运行时请通过环境变量或挂载配置覆盖该占位值
    link: "mysql:root:Fang930927@tcp(120.55.50.105:3306)/ai_voice_voice"
    debug: false

redis:
  default:
    # 运行时请通过环境变量或挂载配置覆盖该占位值
    address: "redis-node-1:7001"
    db: 0

voiceChat:
  debugLog: true
  audio:
    sampleRate: 16000
    bits: 16
    channels: 1
    maxDurationSec: 30
  session:
    maxRounds: 10
    ttlSeconds: 1800
    maxDeviceSessions: 1000
    cleanupIntervalSeconds: 60
  stt:
    provider: "baidu"
    endpoint: "https://vop.baidu.com/server_api"
    streamEnabled: true
    streamEndpoint: "wss://vop.baidu.com/realtime_asr"
    realtimeDebounceMs: 1200
    realtimeMinRunes: 4
    sn: ""
    tokenEndpoint: "https://aip.baidubce.com/oauth/2.0/token"
    apiKey: "iZZApLGcYBhyR5Djqtp7Kc1m"
    apiSecret: "F8uXBqwGwUkpy3tYp6eMEBqX2s1R5wsm"
    model: ""
    cuid: "gofirst-device"
    devPid: 1537
    format: "pcm"
    timeoutSeconds: 20
    maxConcurrency: 50
  deepseek:
    endpoint: "https://api.deepseek.com/v1/chat/completions"
    apiKey: "sk-e5685321acda4a3f8cb15abc5345c130"
    model: "deepseek-chat"
    systemPrompt: ""
    stream: true
    minTextLength: 2
    timeoutSeconds: 20
    maxConcurrency: 100
  tts:
    provider: "baidu"
    streamEnabled: true
    streamEndpoint: "wss://aip.baidubce.com/ws/2.0/speech/publiccloudspeech/v1/tts"
    tokenEndpoint: "https://aip.baidubce.com/oauth/2.0/token"
    apiKey: "iZZApLGcYBhyR5Djqtp7Kc1m"
