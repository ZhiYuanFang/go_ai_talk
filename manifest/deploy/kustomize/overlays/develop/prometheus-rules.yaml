apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: go-ai-talk-alert-rules
spec:
  groups:
    - name: go-ai-talk-slo
      rules:
        - alert: GatewayDown
          expr: up{job="gateway"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: gateway 不可用
            description: gateway 实例在 2 分钟内持续不可达
        - alert: HistoryServiceDown
          expr: up{job="history-service"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: history-service 不可用
            description: history-service 实例在 2 分钟内持续不可达
        - alert: VoiceServiceDown
          expr: up{job="voice-service"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: voice-service 不可用
            description: voice-service 实例在 2 分钟内持续不可达
        - alert: DeviceServiceDown
          expr: up{job="device-service"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: device-service 不可用
            description: device-service 实例在 2 分钟内持续不可达
        - alert: GatewayHighErrorRate
          expr: rate(http_server_requests_seconds_count{job="gateway",code=~"5.."}[5m]) / clamp_min(rate(http_server_requests_seconds_count{job="gateway"}[5m]), 1) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: gateway 5xx 错误率过高
            description: 过去 10 分钟 gateway 5xx 占比超过 5%
