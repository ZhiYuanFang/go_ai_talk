apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiaozhi-mcp-service
  labels:
    app: xiaozhi-mcp-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: xiaozhi-mcp-service
  template:
    metadata:
      labels:
        app: xiaozhi-mcp-service
    spec:
      containers:
        - name: xiaozhi-mcp-service
          image: go-ai-talk/xiaozhi-mcp-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: internal
              containerPort: 9809
          env:
            - name: GF_GCFG_FILE
              value: manifest/config/config.xiaozhi-mcp-service.yaml
            - name: XIAOZHI_MCP_INTERNAL_ADDR
              value: ":9809"
            - name: XIAOZHI_MCP_RECONCILE_INTERVAL_MS
              value: "600000"
            - name: VOICE_SERVICE_URL
              value: http://voice-service:9802
            - name: DEVICE_SERVICE_URL
              value: http://device-service:9803
            - name: DEVICE_GATEWAY_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-internal-secret
                  key: secret
            # 可选迁移 fallback；稳态以 DB 绑定为准，可置空
            - name: XIAOZHI_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: xiaozhi-mcp-credentials
                  key: token
                  optional: true
            - name: XIAOZHI_MCP_DEVICE_NO
              valueFrom:
                secretKeyRef:
                  name: xiaozhi-mcp-credentials
                  key: deviceNo
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: xiaozhi-mcp-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          livenessProbe:
            httpGet:
              path: /xiaozhi-mcp/internal/api/health
              port: 9809
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /xiaozhi-mcp/internal/api/health
              port: 9809
            initialDelaySeconds: 5
            periodSeconds: 10
