apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9901"
        prometheus.io/path: /healthz
    spec:
      containers:
        - name: worker
          image: go-ai-talk/worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9901
              name: http
          env:
            - name: GF_GCFG_FILE
              value: manifest/config/config.worker-service.yaml
            - name: WORKER_HEALTH_ADDR
              value: ":9901"
            # 角色约束：worker 独占异步消费与 outbox relay。
            - name: MQ_CONSUMER_ENABLED
              value: "true"
            - name: OUTBOX_RELAY_ENABLED
              value: "true"
            - name: MQ_HTTP_API_BASE
              value: http://rabbitmq:15672/api
            - name: MQ_USER
              value: guest
            - name: MQ_PASSWORD
              value: guest
            - name: OTEL_SERVICE_NAME
              value: worker
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
